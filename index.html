    :root {
      --bg: #121417;
      --panel: #1A1D22;
      --card: #181B20;
      --border: #2A2F37;
      --text: #E6E1DA;
      --muted: #7C8594;
      --accent: #D4A359;
      --accent-bright: #E5BC78;
      --verse-bar: #5FA8D3;
      --word-active: #F7E8C8;
      --word-read: #4B5260;
      --word-next: #757F91;
      --verse-tag: #7A623A;
      --green: #2B7A50;
      --red: #B83B44;
      --neon-green: #22E584;
      --neon-red: #FF3B5C;
      --neon-mid: #5FA8D3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* Жёсткая привязка к границам экрана без багов 100dvh на iOS */
    #app {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
    #top-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      padding-left: calc(env(safe-area-inset-left, 0px) + 10px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 10px);
      padding-bottom: 8px;
      z-index: 30;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    #top-bar.collapsed .row-secondary {
      display: none;
    }

    select, button {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #22262E;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 34px;
      padding: 0 8px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    select {
      background-image: linear-gradient(45deg, transparent 50%, #7C8594 50%), linear-gradient(135deg, #7C8594 50%, transparent 50%);
      background-position: calc(100% - 11px) 50%, calc(100% - 6px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 20px;
    }

    select:active, button:active {
      transform: scale(0.97);
    }

    #book-select {
      flex: 1 1 auto;
      min-width: 92px;
      text-overflow: ellipsis;
    }

    #chapter-select,
    #verse-select {
      width: 84px;
      flex-shrink: 0;
      padding: 0 18px 0 7px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    #mode-select {
      flex: 1 1 auto;
      min-width: 130px;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .toggle-btn.active {
      background: rgba(34, 229, 132, 0.14);
      border-color: var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 10px rgba(34, 229, 132, 0.22);
    }

    #collapse-btn {
      width: 34px;
      padding: 0;
      flex-shrink: 0;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* --- ПОЛОСА ВЫБОРА ПОДХОДОВ (КОГДА ВКЛЮЧЁН ГРАФИК) --- */
    #plan-section-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px calc(env(safe-area-inset-right, 0px) + 10px) 6px calc(env(safe-area-inset-left, 0px) + 10px);
      background: #15181D;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
      z-index: 29;
    }
    #plan-section-bar::-webkit-scrollbar { display: none; }

    .section-pill {
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: #1E222A;
      border: 1px solid #2D333E;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    .section-pill.active {
      background: rgba(212, 163, 89, 0.16);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    .section-pill.wisdom-pill.active {
      background: rgba(95, 168, 211, 0.16);
      border-color: var(--verse-bar);
      color: #8AC8EC;
    }

    #restore-bar-btn {
      position: absolute;
      top: 8px;
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      width: 34px;
      height: 30px;
      border-radius: 8px;
      background: rgba(26, 29, 34, 0.88);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      cursor: pointer;
    }

    /* --- РАБОЧАЯ ОБЛАСТЬ 1: ХОЛСТ --- */
    #workspace {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #workspace:active { cursor: grabbing; }

    #canvas-root {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }

    .tap-flash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease-out;
      z-index: 5;
    }
    #flash-left {
      left: 0;
      background: radial-gradient(circle at 0% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    #flash-right {
      right: 0;
      background: radial-gradient(circle at 100% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    .tap-flash.show { opacity: 1; transition: opacity 0.04s ease-in; }

    /* --- КАРТОЧКА (ДЛЯ БЛОКОВ И СТИХОВ) --- */
    #card-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
    }

    #block-progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prog-label {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      width: 100%;
      height: 7px;
      background: #1F242C;
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.16s ease-out;
    }

    .prog-fill.verse-fill { background: var(--verse-bar); }

    #text-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    #text-card.bound-start {
      border-color: rgba(34, 229, 132, 0.72);
      box-shadow:
        inset 4px 0 0 var(--neon-green),
        0 0 22px rgba(34, 229, 132, 0.22),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }

    #text-card.bound-end {
      border-color: rgba(255, 59, 92, 0.75);
      box-shadow:
        inset -4px 0 0 var(--neon-red),
        0 0 24px rgba(255, 59, 92, 0.24),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }

    #text-card.bound-mid {
      border-color: rgba(95, 168, 211, 0.7);
      box-shadow:
        inset 4px 0 0 var(--neon-mid),
        0 0 20px rgba(95, 168, 211, 0.2),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .card-bound-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .card-bound-pill.start {
      color: var(--neon-green);
      background: rgba(34, 229, 132, 0.12);
      border: 1px solid rgba(34, 229, 132, 0.5);
      box-shadow: 0 0 12px rgba(34, 229, 132, 0.28);
    }

    .card-bound-pill.end {
      color: var(--neon-red);
      background: rgba(255, 59, 92, 0.12);
      border: 1px solid rgba(255, 59, 92, 0.55);
      box-shadow: 0 0 12px rgba(255, 59, 92, 0.28);
    }

    .card-bound-pill.mid {
      color: #8AC8EC;
      background: rgba(95, 168, 211, 0.14);
      border: 1px solid rgba(95, 168, 211, 0.55);
      box-shadow: 0 0 12px rgba(95, 168, 211, 0.26);
    }

    .bound-pill-wrap { text-align: center; }

    .block-ref {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .block-main {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
      margin-bottom: 16px;
      animation: popIn 0.12s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0.55; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .block-dots {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .dot-active { color: var(--accent); }
    .dot-done { color: #4C566A; }
    .dot-todo { color: #2E3440; }

    .block-divider { height: 1px; background: var(--border); margin: 12px 0 14px; }
    .block-context { text-align: center; font-size: 15px; line-height: 1.5; }
    .ctx-active { color: var(--accent); font-weight: 600; }
    .ctx-done { color: #616A78; }
    .ctx-todo { color: #949DAB; }

    .block-adj {
      margin-top: 14px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.45;
      color: #4B5260;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .verse-ref { color: var(--accent); font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .verse-body { font-size: 21px; line-height: 1.55; color: var(--text); }

    /* --- НЕОНОВЫЕ ПОЛОСЫ-ГРАНИЦЫ В ЛЕНТАХ --- */
    .neon-gate {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin: 0 22px;
      flex-shrink: 0;
    }

    .neon-gate-line { width: 4px; height: 76px; border-radius: 4px; }

    .neon-gate-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.3px;
      margin-top: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .neon-gate.start .neon-gate-line {
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green), 0 0 20px rgba(34, 229, 132, 0.75);
    }
    .neon-gate.start .neon-gate-tag {
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(34, 229, 132, 0.7);
    }

    .neon-gate.end .neon-gate-line {
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red), 0 0 20px rgba(255, 59, 92, 0.78);
    }
    .neon-gate.end .neon-gate-tag {
      color: var(--neon-red);
      text-shadow: 0 0 8px rgba(255, 59, 92, 0.7);
    }

    .neon-gate.mid { margin: 0 18px; }
    .neon-gate.mid .neon-gate-line {
      width: 3px;
      height: 62px;
      background: var(--neon-mid);
      box-shadow: 0 0 8px var(--neon-mid), 0 0 16px rgba(95, 168, 211, 0.7);
    }
    .neon-gate.mid .neon-gate-tag {
      color: #8AC8EC;
      font-size: 9.5px;
      text-shadow: 0 0 8px rgba(95, 168, 211, 0.65);
    }

    /* --- РЕЖИМ "ПО СЛОВАМ" --- */
    #word-stream-root { position: absolute; top: 0; left: 0; display: none; }

    #word-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
    }

    .stream-word {
      display: inline-block;
      margin: 0 9px;
      font-size: 22px;
      line-height: 1;
      transition: color 0.1s ease;
    }

    .stream-word.read { color: var(--word-read); }
    .stream-word.next { color: var(--word-next); }
    .stream-word.active {
      font-size: 46px;
      font-weight: 700;
      color: var(--word-active);
      margin: 0 14px;
      text-shadow: 0 0 18px rgba(212, 163, 89, 0.25);
    }

    .stream-vtag {
      display: inline-block;
      font-size: 11px;
      color: var(--verse-tag);
      vertical-align: super;
      margin-right: -4px;
      margin-left: 6px;
      transform: translateY(-9px);
    }

    /* --- РЕЖИМ "БЕГУЩАЯ СТРОКА" --- */
    #ticker-stream-root { position: absolute; top: 0; left: 0; display: none; }

    #ticker-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      padding-right: 16px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .ticker-vtag {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.72;
      margin-right: 7px;
      transform: translateY(-10px);
    }

    /* --- ФИКСИРОВАННЫЙ HUD ПРОГРЕССА --- */
    #word-hud {
      position: absolute;
      top: 10px;
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      background: rgba(20, 23, 28, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(46, 53, 64, 0.88);
      border-radius: 10px;
      padding: 9px 12px;
      z-index: 15;
      display: none;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .hud-section { display: flex; flex-direction: column; gap: 4px; }
    .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #hud-ref {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #hud-ch-lbl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #hud-v-lbl { font-size: 12px; color: var(--verse-bar); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* --- ЕДИНЫЙ СОВЕТСКИЙ ПРИБОР СКОРОСТИ --- */
    #speed-dock {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 9px calc(env(safe-area-inset-right, 0px) + 12px) 9px calc(env(safe-area-inset-left, 0px) + 12px);
      background: var(--panel);
      border-top: 1px solid var(--border);
      z-index: 28;
      flex-shrink: 0;
    }

    #ticker-invert-btn {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #20242C;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      flex-shrink: 0;
    }

    #ticker-invert-btn svg { width: 21px; height: 21px; display: block; }

    #ticker-invert-btn.active {
      border-color: var(--accent);
      background: rgba(212, 163, 89, 0.16);
      color: var(--accent-bright);
      box-shadow: 0 0 12px rgba(212, 163, 89, 0.25);
    }

    #soviet-gauge-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 62px;
      padding: 6px 12px 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #21252D 0%, #181B20 100%);
      border: 1.5px solid #323842;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.05), inset 0 -2px 6px rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    #soviet-gauge-btn:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .gauge-screw {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #555D6B, #252A32);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.7);
    }
    .gauge-screw.tl { top: 4px; left: 4px; }
    .gauge-screw.tr { top: 4px; right: 4px; }
    .gauge-screw.bl { bottom: 4px; left: 4px; }
    .gauge-screw.br { bottom: 4px; right: 4px; }

    .gauge-dial-window {
      width: 86px;
      height: 46px;
      background: radial-gradient(ellipse at 50% 96%, #1D1B17 0%, #121417 85%);
      border: 1px solid #2A2F37;
      border-radius: 7px;
      box-shadow: inset 0 2px 7px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .gauge-dial-window svg { width: 84px; height: 44px; display: block; }

    #gauge-needle-group {
      transform-origin: 50px 46px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gauge-readout {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 68px;
    }

    .gauge-caption {
      font-size: 8.5px;
      letter-spacing: 1.1px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .gauge-value-box {
      background: #121417;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 19px;
      font-weight: 700;
      color: var(--accent-bright);
      text-shadow: 0 0 8px rgba(212, 163, 89, 0.28);
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    #speed-play-btn {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid #355242;
      background: linear-gradient(180deg, #2E8557 0%, #226341 100%);
      color: #F3F6F4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.38);
      cursor: pointer;
      flex-shrink: 0;
    }

    #speed-play-btn svg { width: 22px; height: 22px; display: block; }

    #speed-play-btn.running {
      border-color: #6B5533;
      background: linear-gradient(180deg, #C7964D 0%, #9A7134 100%);
      color: #121417;
    }

    /* --- МОДАЛЬНОЕ ОКНО ВЫБОРА ГРАФИКА И ДНЯ --- */
    #plan-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
    }

    #plan-modal-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.16s ease-out;
    }

    #plan-modal {
      width: min(460px, 100%);
      max-height: 100%;
      background: #14171C;
      border: 1px solid #2E3440;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
    }

    .plan-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      background: var(--panel);
      gap: 10px;
    }

    .plan-modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .plan-header-actions { display: flex; align-items: center; gap: 8px; }

    #plan-exit-btn {
      display: none;
      height: 30px;
      padding: 0 10px;
      background: rgba(184, 59, 68, 0.22);
      border-color: rgba(255, 59, 92, 0.5);
      color: #FF6B84;
      font-size: 12.5px;
      font-weight: 600;
    }

    #plan-close-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
    }

    .plan-tabs-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 16px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .plan-tab-btn {
      height: 32px;
      border-radius: 8px;
      background: #12151A;
      border: 1px solid #2A303B;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .plan-tab-btn.active {
      background: rgba(212, 163, 89, 0.16);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    #plan-jump-row {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #16191F;
      border-bottom: 1px solid var(--border);
    }

    #plan-jump-row label {
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* 16px предотвращает авто-зум Safari при фокусе на поле ввода */
    #plan-jump-input {
      flex: 1;
      height: 34px;
      background: #121417;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 16px;
      padding: 0 10px;
      user-select: text;
      -webkit-user-select: text;
    }

    #plan-jump-go {
      height: 34px;
      padding: 0 14px;
      background: rgba(212, 163, 89, 0.18);
      border-color: var(--accent);
      color: var(--accent-bright);
      font-size: 13px;
      font-weight: 600;
    }

    #plan-days-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .plan-day-card {
      width: 100%;
      height: auto;
      padding: 10px 12px;
      background: #1A1E25;
      border: 1px solid #282E38;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .plan-day-card.active {
      border-color: var(--neon-green);
      background: rgba(34, 229, 132, 0.08);
      box-shadow: 0 0 14px rgba(34, 229, 132, 0.16);
    }

    .plan-day-num {
      width: 48px;
      height: 46px;
      border-radius: 10px;
      background: #12151A;
      border: 1px solid #2C333F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .plan-day-card.active .plan-day-num { border-color: var(--neon-green); color: var(--neon-green); }
    .plan-day-num span:first-child { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }
    .plan-day-num span:last-child { font-size: 16px; font-weight: 700; line-height: 1.1; }

    .plan-day-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .plan-line-row { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plan-line-row.wisdom { font-size: 12px; color: var(--accent); }
    .plan-line-row.nt { font-size: 12px; color: var(--verse-bar); }
    .plan-line-row.sub { font-size: 11.5px; color: var(--muted); }
    .plan-line-badge { display: inline-block; font-size: 10px; color: var(--muted); margin-right: 5px; text-transform: uppercase; }

    /* --- ВЫДВИЖНОЙ ВЫБОР СКОРОСТИ В СТИЛЕ ТАЙМЕРА iOS --- */
    #ios-speed-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
    }

    #ios-speed-backdrop.open { display: flex; animation: fadeBackdrop 0.16s ease-out; }

    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #ios-speed-sheet {
      width: min(410px, 100%);
      background: #14171C;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 18px 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideUpSheet 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUpSheet {
      from { transform: translateY(28px); opacity: 0.6; }
      to   { transform: translateY(0); opacity: 1; }
    }

    #ios-ruler-viewport {
      position: relative;
      width: 100%;
      height: 78px;
      overflow: hidden;
      touch-action: none;
      cursor: ew-resize;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
    }

    #ios-ruler-track {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      will-change: transform;
    }

    .ios-tick {
      position: relative;
      width: 14px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    .ios-tick-num {
      position: absolute;
      top: 4px;
      font-size: 15px;
      font-weight: 600;
      color: rgba(212, 163, 89, 0.72);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }

    .ios-tick-bar {
      width: 3px;
      height: 34px;
      border-radius: 2px;
      background: rgba(212, 163, 89, 0.38);
      transition: background 0.08s ease, height 0.08s ease;
    }

    .ios-tick.major .ios-tick-bar { height: 42px; background: rgba(212, 163, 89, 0.72); }
    .ios-tick.selected .ios-tick-bar {
      background: var(--accent-bright);
      height: 44px;
      box-shadow: 0 0 10px rgba(212, 163, 89, 0.65);
    }
    .ios-tick.selected .ios-tick-num { color: var(--accent-bright); }

    .ios-pointer-row { display: flex; justify-content: center; margin-top: -2px; margin-bottom: 6px; }
    .ios-triangle {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 10px solid var(--accent-bright);
      filter: drop-shadow(0 0 6px rgba(212, 163, 89, 0.45));
    }

    .ios-bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 2px; }

    #ios-confirm-btn {
      height: 44px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid rgba(212, 163, 89, 0.35);
      background: rgba(212, 163, 89, 0.16);
      color: var(--accent-bright);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #ios-confirm-btn:active { background: rgba(212, 163, 89, 0.28); }

    .ios-big-readout {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--accent-bright);
      font-variant-numeric: tabular-nums;
    }

    #ios-big-wpm { font-size: 38px; font-weight: 400; line-height: 1; letter-spacing: -0.5px; }
    .ios-big-unit { font-size: 15px; opacity: 0.75; }

    /* --- РАБОЧАЯ ОБЛАСТЬ 2: ОБЫЧНЫЙ СКРОЛЛ ("ПО ГЛАВАМ") --- */
    #chapter-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: none;
      padding: 18px calc(env(safe-area-inset-right, 0px) + 14px) 48px calc(env(safe-area-inset-left, 0px) + 14px);
    }

    #chapter-container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px 28px;
      user-select: text;
      -webkit-user-select: text;
    }

    .ch-title { color: var(--accent); font-size: 23px; font-weight: 700; margin-bottom: 18px; }
    .ch-verse { font-size: 19px; line-height: 1.65; margin-bottom: 12px; color: var(--text); }
    .ch-vnum { color: var(--muted); font-size: 14px; font-weight: 700; margin-right: 6px; }
    .ch-dot { color: #4C566A; margin: 0 5px; }

    .ch-neon-banner { height: 3px; border-radius: 3px; margin: 14px 0; }
    .ch-neon-banner.start { background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }
    .ch-neon-banner.end { background: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

    .ch-sub-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 14px;
      color: #8AC8EC;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .ch-sub-divider::before,
    .ch-sub-divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--neon-mid);
      box-shadow: 0 0 8px rgba(95, 168, 211, 0.7);
      border-radius: 2px;
    }

    .ch-nav-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .ch-nav-row button { flex: 1; height: 40px; font-size: 14px; font-weight: 500; }

    /* --- НИЖНЯЯ СТРОКА СОСТОЯНИЯ --- */
    #status-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 6px calc(env(safe-area-inset-right, 0px) + 14px) max(env(safe-area-inset-bottom, 0px), 8px) calc(env(safe-area-inset-left, 0px) + 14px);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      z-index: 30;
    }

    /* =====================================================================
       КОМПАКТНЫЙ АЛЬБОМНЫЙ РЕЖИМ
       ===================================================================== */
    body.landscape-compact #top-bar {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
      padding-bottom: 6px;
      padding-left: calc(env(safe-area-inset-left, 0px) + 12px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 12px);
    }

    body.landscape-compact #top-bar.collapsed { display: none; }
    body.landscape-compact #top-bar.collapsed + #plan-section-bar { display: none !important; }
    body.landscape-compact.bar-hidden #restore-bar-btn { display: flex; }

    body.landscape-compact #plan-section-bar { padding-top: 4px; padding-bottom: 4px; }
    body.landscape-compact .section-pill { height: 24px; font-size: 11.5px; padding: 0 9px; }

    body.landscape-compact .top-row { gap: 5px; }
    body.landscape-compact .row-primary { flex: 1 1 auto; }
    body.landscape-compact .row-secondary { flex: 0 1 auto; }

    body.landscape-compact #top-bar select,
    body.landscape-compact #top-bar button {
      height: 30px;
      font-size: 13px;
      border-radius: 7px;
      padding: 0 7px;
    }

    body.landscape-compact #top-bar select {
      padding-right: 18px;
    }

    body.landscape-compact #book-select { min-width: 90px; max-width: 170px; }
    body.landscape-compact #chapter-select,
    body.landscape-compact #verse-select { width: 76px; padding: 0 16px 0 6px; }
    body.landscape-compact #mode-select { min-width: 130px; max-width: 170px; }
    body.landscape-compact #collapse-btn { width: 30px; padding: 0; }

    body.landscape-compact #word-hud {
      top: 6px;
      padding: 5px 12px;
      border-radius: 8px;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    body.landscape-compact #word-hud .hud-section { flex: 1 1 0; gap: 3px; }
    body.landscape-compact #hud-ref { font-size: 12px; }
    body.landscape-compact #hud-ch-lbl,
    body.landscape-compact #hud-v-lbl { font-size: 11px; }
    body.landscape-compact #word-hud .prog-track { height: 4px !important; }

    body.landscape-compact #speed-dock {
      padding: 5px calc(env(safe-area-inset-right, 0px) + 12px) max(env(safe-area-inset-bottom, 0px), 6px) calc(env(safe-area-inset-left, 0px) + 12px);
      gap: 10px;
    }

    body.landscape-compact #ticker-invert-btn { width: 36px; height: 36px; }
    body.landscape-compact #ticker-invert-btn svg { width: 17px; height: 17px; }

    body.landscape-compact #soviet-gauge-btn {
      height: 42px;
      padding: 3px 10px 3px 8px;
      gap: 8px;
      border-radius: 9px;
      border-width: 1px;
    }

    body.landscape-compact .gauge-screw { width: 4px; height: 4px; }
    body.landscape-compact .gauge-dial-window { width: 62px; height: 32px; border-radius: 6px; }
    body.landscape-compact .gauge-dial-window svg { width: 60px; height: 30px; }
    body.landscape-compact .gauge-readout { flex-direction: row; align-items: baseline; gap: 5px; min-width: 0; }
    body.landscape-compact .gauge-caption { display: none; }
    body.landscape-compact .gauge-value-box { font-size: 15px; padding: 1px 6px; }
    body.landscape-compact .gauge-unit { font-size: 10px; margin-top: 0; }

    body.landscape-compact #speed-play-btn { width: 38px; height: 38px; }
    body.landscape-compact #speed-play-btn svg { width: 17px; height: 17px; }

    body.landscape-compact #status-bar { display: none; }

    body.landscape-compact #text-card { padding: 14px 18px; }
    body.landscape-compact .block-ref { margin-bottom: 8px; }
    body.landscape-compact .block-main { font-size: 22px; margin-bottom: 10px; }
    body.landscape-compact .block-dots { margin-bottom: 6px; }
    body.landscape-compact .block-divider { margin: 8px 0; }
    body.landscape-compact .block-adj { display: none; }

    body.landscape-compact #ios-speed-sheet {
      padding: 12px 16px 12px;
      border-radius: 20px;
      gap: 4px;
    }
    body.landscape-compact #ios-ruler-viewport { height: 64px; }
    body.landscape-compact #ios-big-wpm { font-size: 32px; }
    body.landscape-compact #ios-confirm-btn { height: 38px; font-size: 15px; }

    /* --- ЭКРАН ЗАГРУЗКИ И ДИАГНОСТИКИ (НИКАКОГО ЧЁРНОГО ЭКРАНА) --- */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      z-index: 100;
      color: var(--text);
      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #loader-actions {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      width: min(280px, 100%);
    }

    #loader-actions button {
      height: 40px;
      font-weight: 600;
      border-radius: 10px;
    }

    #btn-reset-cache {
      background: rgba(212, 163, 89, 0.18);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div id="loader-spinner" class="spinner"></div>
    <div id="loader-text">Загрузка Писания RST+...</div>
    <div id="loader-actions">
      <button id="btn-retry-load" type="button">Повторить загрузку</button>
      <button id="btn-reset-cache" type="button">Сбросить кэш и обновить</button>
    </div>
  </div>

  <div id="app">
    <header id="top-bar">
      <div class="top-row row-primary">
        <select id="book-select" aria-label="Книга"></select>
        <select id="chapter-select" aria-label="Глава"></select>
        <select id="verse-select" aria-label="Стих"></select>
        <button id="collapse-btn" title="Свернуть/развернуть панель">▲</button>
      </div>
      <div class="top-row row-secondary">
        <select id="mode-select" aria-label="Режим">
          <option value="WORDS" selected>По словам</option>
          <option value="BLOCKS">Смысловыми блоками</option>
          <option value="TICKER">Бегущая строка</option>
          <option value="VERSES">По стихам</option>
          <option value="CHAPTERS">По главам</option>
        </select>
        <button id="plan-btn" class="toggle-btn">График</button>
        <button id="center-btn" class="toggle-btn">Центр</button>
      </div>
    </header>

    <nav id="plan-section-bar" aria-label="Подходы дня"></nav>

    <main id="workspace">
      <button id="restore-bar-btn" type="button" title="Показать панель">▼</button>
      <div id="flash-left" class="tap-flash"></div>
      <div id="flash-right" class="tap-flash"></div>

      <div id="word-hud">
        <div class="hud-section">
          <div class="hud-row">
            <span id="hud-ref">Бытие 1:1</span>
            <span id="hud-ch-lbl">Гл. 1 — 0%</span>
          </div>
          <div class="prog-track"><div id="hud-ch-fill" class="prog-fill"></div></div>
        </div>
        <div class="hud-section">
          <div class="hud-row">
            <span id="hud-v-lbl">Ст. 1 — 0%</span>
          </div>
          <div class="prog-track" style="height:5px;"><div id="hud-v-fill" class="prog-fill verse-fill"></div></div>
        </div>
      </div>

      <div id="canvas-root">
        <div id="card-stack">
          <div id="block-progress-box">
            <div id="block-prog-lbl" class="prog-label">Глава 1 — 0%</div>
            <div class="prog-track"><div id="block-prog-fill" class="prog-fill"></div></div>
          </div>
          <div id="text-card"></div>
        </div>

        <div id="word-stream-root">
          <div id="word-tape"></div>
        </div>

        <div id="ticker-stream-root">
          <div id="ticker-tape"></div>
        </div>
      </div>

      // --- ТОЧНАЯ ОЧИСТКА ТЕГОВ MYBIBLE ---
      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function cleanPlainText(raw) {
        if (!raw) return '';
        let s = String(raw);
        s = s.replace(/<f>[\s\S]*?<\/f>|<n>[\s\S]*?<\/n>/g, '');
        s = s.replace(/<S>[\s\S]*?<\/S>/g, '');
        s = s.replace(/<[^>]+>/g, '');
        s = s.replace(/\s+/g, ' ').trim();
        s = s.replace(/ ([.,;:!?])/g, '$1');
        return s;
      }

      function cleanVerseHtml(raw) {
        return escapeHtml(cleanPlainText(raw));
      }

      function splitIntoWords(raw) {
        const clean = cleanPlainText(raw);
        if (!clean) return ['—'];
        const arr = clean.split(' ').filter(Boolean);
        return arr.length ? arr : ['—'];
      }

      function getVerseWordsCached(b, c, v) {
        const key = b + '_' + c + '_' + v;
        if (verseWordsCache.has(key)) return verseWordsCache.get(key);
        const raw = (bibleData[b] && bibleData[b][c] && bibleData[b][c][v]) ? bibleData[b][c][v] : '';
        const words = splitIntoWords(raw);
        verseWordsCache.set(key, words);
        return words;
      }

      const BREAK_CONJ = new Set([
        'и','но','а','что','чтобы','ибо','потому','когда','как',
        'который','которая','которые','если','дабы'
      ]);
      const STICKY_PREP = new Set([
        'в','во','на','над','под','к','ко','с','со','у','о','об',
        'от','из','за','по','не','ни','да','же','для','до'
      ]);

      function splitIntoSemanticBlocks(raw) {
        const clean = cleanPlainText(raw);
        if (!clean) return ['—'];
        const words = clean.split(' ').filter(Boolean);
        const blocks = [];
        let curWords = [];
        let curLen = 0;

        for (let i = 0; i < words.length; i++) {
          const w = words[i];
          const wLower = w.toLowerCase().replace(/[,;:.]+$/, '');
          const prevLower = curWords.length ? curWords[curWords.length - 1].toLowerCase() : '';

          if (BREAK_CONJ.has(wLower) && curWords.length >= 2 && curLen >= 14 && !STICKY_PREP.has(prevLower)) {
            blocks.push(curWords.join(' '));
            curWords = [];
            curLen = 0;
          }

          curWords.push(w);
          curLen += w.length + 1;

          const endsPunct = /[,;:.!?—]$/.test(w);
          const isSticky = STICKY_PREP.has(wLower);

          if (!isSticky) {
            if (endsPunct && (curLen >= 10 || curWords.length >= 2)) {
              blocks.push(curWords.join(' '));
              curWords = [];
              curLen = 0;
            } else if (curLen >= 32 || curWords.length >= 5) {
              blocks.push(curWords.join(' '));
              curWords = [];
              curLen = 0;
            }
          }
        }

        if (curWords.length) {
          if (curWords.length === 1 && curLen < 10 && blocks.length) {
            blocks[blocks.length - 1] += ' ' + curWords[0];
          } else {
            blocks.push(curWords.join(' '));
          }
        }
        return blocks.length ? blocks : ['—'];
      }

      // --- ГЕНЕРАЦИЯ ГОДОВЫХ ПЛАНОВ (365 ДНЕЙ) ---
      function formatBookRangeLabel(sb, sc, sv, eb, ec, ev, wholeChapters) {
        const n1 = booksNames[sb] || ('Кн.' + sb);
        const n2 = booksNames[eb] || ('Кн.' + eb);
        if (wholeChapters) {
          if (sb === eb) return sc === ec ? (n1 + ' ' + sc) : (n1 + ' ' + sc + '–' + ec);
          return n1 + ' ' + sc + ' – ' + n2 + ' ' + ec;
        }
        if (sb === eb) {
          return sc === ec ? (n1 + ' ' + sc + ':' + sv + '–' + ev) : (n1 + ' ' + sc + ':' + sv + ' – ' + ec + ':' + ev);
        }
        return n1 + ' ' + sc + ':' + sv + ' – ' + n2 + ' ' + ec + ':' + ev;
      }

      function partitionUnitsIntoDays(units, numDays) {
        const totalWeight = units.reduce((acc, u) => acc + u.weight, 0);
        const result = [];
        let cursor = 0;
        let accWeight = 0;

        for (let d = 0; d < numDays; d++) {
          const remainingDays = numDays - d;
          const startIdx = cursor;
          const target = ((d + 1) * totalWeight) / numDays;

          if (d === numDays - 1) {
            cursor = units.length;
          } else {
            while (cursor < units.length - (remainingDays - 1)) {
              const nextW = accWeight + units[cursor].weight;
              if (cursor > startIdx && Math.abs(nextW - target) > Math.abs(accWeight - target)) {
                break;
              }
              accWeight = nextW;
              cursor++;
              if (accWeight >= target) break;
            }
            if (cursor === startIdx && cursor < units.length) {
              accWeight += units[cursor].weight;
              cursor++;
            }
          }
          result.push({ first: units[startIdx], last: units[cursor - 1] });
        }
        return result;
      }

      function buildYearlyPlans() {
        const allChapters = [];
        const otChapters = [];
        const ntVerses = [];

        for (let bi = 0; bi < booksOrder.length; bi++) {
          const b = booksOrder[bi];
          const chList = bookChaptersSorted[b] || [];
          for (let ci = 0; ci < chList.length; ci++) {
            const c = chList[ci];
            const vList = (chapterVersesSorted[b] && chapterVersesSorted[b][c]) ? chapterVersesSorted[b][c] : [];
            if (!vList.length) continue;
            let chLen = 0;
            for (let vi = 0; vi < vList.length; vi++) {
              const v = vList[vi];
              const raw = String((bibleData[b] && bibleData[b][c] && bibleData[b][c][v]) ? bibleData[b][c][v] : '');
              const len = Math.max(12, raw.length);
              chLen += len;
              if (b >= 470) {
                ntVerses.push({ b: b, c: c, v: v, weight: len });
              }
            }
            const chUnit = { b: b, c: c, firstV: vList[0], lastV: vList[vList.length - 1], weight: chLen };
            allChapters.push(chUnit);
            if (b < 470) otChapters.push(chUnit);
          }
        }

        const straightParts = partitionUnitsIntoDays(allChapters, 365);
        READING_PLAN_365_STRAIGHT = straightParts.map((seg, i) => ({
          day: i + 1,
          r: [seg.first.b, seg.first.c, seg.first.firstV, seg.last.b, seg.last.c, seg.last.lastV],
          ml: formatBookRangeLabel(seg.first.b, seg.first.c, seg.first.firstV, seg.last.b, seg.last.c, seg.last.lastV, true)
        }));

        const otParts = partitionUnitsIntoDays(otChapters, 365);
        const ntParts = partitionUnitsIntoDays(ntVerses, 365);
        READING_PLAN_365_COMBO = [];
        for (let i = 0; i < 365; i++) {
          const o = otParts[i];
          const n = ntParts[i];
          READING_PLAN_365_COMBO.push({
            day: i + 1,
            ot: [o.first.b, o.first.c, o.first.firstV, o.last.b, o.last.c, o.last.lastV],
            nt: [n.first.b, n.first.c, n.first.v, n.last.b, n.last.c, n.last.v],
            otl: formatBookRangeLabel(o.first.b, o.first.c, o.first.firstV, o.last.b, o.last.c, o.last.lastV, true),
            ntl: formatBookRangeLabel(n.first.b, n.first.c, n.first.v, n.last.b, n.last.c, n.last.v, false)
          });
        }
      }

      // --- ЛОГИКА ГРАФИКОВ И ПОДХОДОВ ---
      function buildLineRangeData(bookSeq, startBook, startCh, startV, endBook, endCh, endV, allowWrap) {
        const verses = [];
        const indexMap = new Map();
        const books = [];
        const chaptersByBook = {};
        const versesByBookChap = {};

        const startIdx = bookSeq.indexOf(startBook);
        const endIdx = bookSeq.indexOf(endBook);
        if (startIdx === -1 || endIdx === -1) {
          return { verses, indexMap, books, chaptersByBook, versesByBookChap };
        }

        const spanBooks = [];
        if (startIdx < endIdx) {
          for (let i = startIdx; i <= endIdx; i++) spanBooks.push(bookSeq[i]);
        } else if (startIdx === endIdx) {
          const sameBookWrap = allowWrap && (startCh > endCh || (startCh === endCh && startV > endV));
          if (sameBookWrap) {
            for (let i = startIdx; i < bookSeq.length; i++) spanBooks.push(bookSeq[i]);
            for (let i = 0; i <= endIdx; i++) spanBooks.push(bookSeq[i]);
          } else {
            spanBooks.push(bookSeq[startIdx]);
          }
        } else if (allowWrap) {
          for (let i = startIdx; i < bookSeq.length; i++) spanBooks.push(bookSeq[i]);
          for (let i = 0; i <= endIdx; i++) spanBooks.push(bookSeq[i]);
        }

        for (let bi = 0; bi < spanBooks.length; bi++) {
          const b = spanBooks[bi];
          const isFirstBook = (bi === 0);
          const isLastBook = (bi === spanBooks.length - 1);
          const chList = bookChaptersSorted[b] || [];

          for (let ci = 0; ci < chList.length; ci++) {
            const c = chList[ci];
            if (isFirstBook && c < startCh) continue;
            if (isLastBook && c > endCh) break;
            const vList = (chapterVersesSorted[b] && chapterVersesSorted[b][c]) ? chapterVersesSorted[b][c] : [];

            for (let vi = 0; vi < vList.length; vi++) {
              const v = vList[vi];
              if (isFirstBook && c === startCh && v < startV) continue;
              if (isLastBook && c === endCh && v > endV) break;

              const key = b + '_' + c + '_' + v;
              indexMap.set(key, verses.length);
              verses.push({ b: b, c: c, v: v });

              if (!books.includes(b)) books.push(b);
              if (!chaptersByBook[b]) chaptersByBook[b] = [];
              if (!chaptersByBook[b].includes(c)) chaptersByBook[b].push(c);
              const bcKey = b + '_' + c;
              if (!versesByBookChap[bcKey]) versesByBookChap[bcKey] = [];
              versesByBookChap[bcKey].push(v);
            }
          }
        }

        return { verses, indexMap, books, chaptersByBook, versesByBookChap };
      }

      function activatePlanDay(type, dayNum) {
        const sections = [];

        if (type === '35') {
          const entry = READING_PLAN_35.find((d) => d.day === dayNum);
          if (!entry) return;
          const mainSeq = booksOrder.filter((b) => !WISDOM_BOOK_IDS.includes(b));

          const rP2 = buildLineRangeData(mainSeq, STD_BOOK_IDS[entry.p2[0]], entry.p2[1], entry.p2[2], STD_BOOK_IDS[entry.p2[3]], entry.p2[4], entry.p2[5], false);
          const rAllMain = buildLineRangeData(mainSeq, STD_BOOK_IDS[entry.p1[0]], entry.p1[1], entry.p1[2], STD_BOOK_IDS[entry.p2[3]], entry.p2[4], entry.p2[5], false);
          const rWis = buildLineRangeData(wisSeq, STD_BOOK_IDS[entry.w[0]], entry.w[1], entry.w[2], STD_BOOK_IDS[entry.w[3]], entry.w[4], entry.w[5], true);

          const mainBounds = new Map();
          mainBounds.set(STD_BOOK_IDS[entry.p2[0]] + '_' + entry.p2[1] + '_' + entry.p2[2], 'ПОДХОД 2');

          sections.push({ id: 'p1', label: 'Подход 1', isWisdom: false, rangeData: rP1, subBoundaries: new Map() });
          sections.push({ id: 'p2', label: 'Подход 2', isWisdom: false, rangeData: rP2, subBoundaries: new Map() });
          sections.push({ id: 'all_main', label: 'Вся осн.', isWisdom: false, rangeData: rAllMain, subBoundaries: mainBounds });
          sections.push({ id: 'wisdom', label: 'Мудрость', isWisdom: true, rangeData: rWis, subBoundaries: new Map() });
        } else if (type === '20') {
          const entry = READING_PLAN_20.find((d) => d.day === dayNum);
          if (!entry) return;
          const allBounds = new Map();

          for (let i = 0; i < entry.p.length; i++) {
            const seg = entry.p[i];
            const rd = buildLineRangeData(booksOrder, STD_BOOK_IDS[seg[0]], seg[1], seg[2], STD_BOOK_IDS[seg[3]], seg[4], seg[5], false);
            sections.push({ id: 'p' + (i + 1), label: 'Подход ' + (i + 1), isWisdom: false, rangeData: rd, subBoundaries: new Map() });
            if (i > 0) {
              allBounds.set(STD_BOOK_IDS[seg[0]] + '_' + seg[1] + '_' + seg[2], 'ПОДХОД ' + (i + 1));
            }
          }

          const firstSeg = entry.p[0];
          const lastSeg = entry.p[entry.p.length - 1];
          const rAllDay = buildLineRangeData(booksOrder, STD_BOOK_IDS[firstSeg[0]], firstSeg[1], firstSeg[2], STD_BOOK_IDS[lastSeg[3]], lastSeg[4], lastSeg[5], false);
          sections.push({ id: 'all_day', label: 'Весь день', isWisdom: false, rangeData: rAllDay, subBoundaries: allBounds });
        } else if (type === '365s') {
          const entry = READING_PLAN_365_STRAIGHT.find((d) => d.day === dayNum);
          if (!entry) return;
          const rd = buildLineRangeData(booksOrder, entry.r[0], entry.r[1], entry.r[2], entry.r[3], entry.r[4], entry.r[5], false);
          sections.push({ id: 'day', label: 'День', isWisdom: false, rangeData: rd, subBoundaries: new Map() });
        } else if (type === '365c') {
          const entry = READING_PLAN_365_COMBO.find((d) => d.day === dayNum);
          if (!entry) return;
          const rOT = buildLineRangeData(booksOrder, entry.ot[0], entry.ot[1], entry.ot[2], entry.ot[3], entry.ot[4], entry.ot[5], false);
          const rNT = buildLineRangeData(booksOrder, entry.nt[0], entry.nt[1], entry.nt[2], entry.nt[3], entry.nt[4], entry.nt[5], false);
          sections.push({ id: 'ot', label: 'Ветхий Завет', isWisdom: false, rangeData: rOT, subBoundaries: new Map() });
          sections.push({ id: 'nt', label: 'Новый Завет', isWisdom: true, rangeData: rNT, subBoundaries: new Map() });
        }

        if (!sections.length) return;
        planActive = true;
        planType = type;
        planModalTab = type;
        planDayNum = dayNum;
        planSections = sections;
        planActiveSectionId = sections[0].id;
        tickerAutoRunning = false;
        wordsAutoRunning = false;

        const firstV = sections[0].rangeData.verses[0];
        if (firstV) {
          currentBook = firstV.b;
          currentChapter = firstV.c;
          currentVerse = firstV.v;
          currentBlockIdx = 0;
          currentWordIdx = 0;
        }

        updatePlanButtonUI();
        renderPlanSectionBar();
        populateBookSelector();
        updateSovietGaugeUI();
        closePlanModal();
        refreshView();
        if (displayMode !== 'CHAPTERS') centerCamera(false);
      }

      function deactivatePlanMode() {
        planActive = false;
        planDayNum = 0;
        planSections = [];
        planActiveSectionId = '';
        tickerAutoRunning = false;
        wordsAutoRunning = false;
        updatePlanButtonUI();
        renderPlanSectionBar();
        populateBookSelector();
        updateSovietGaugeUI();
        closePlanModal();
        refreshView();
        if (displayMode !== 'CHAPTERS') centerCamera(false);
      }

      function updatePlanButtonUI() {
        if (planActive) {
          elPlanBtn.classList.add('active');
          const totalD = (planType === '365s' || planType === '365c') ? '365' : planType;
          elPlanBtn.textContent = 'Д' + planDayNum + '/' + totalD;
          elPlanExitBtn.style.display = 'inline-flex';
        } else {
          elPlanBtn.classList.remove('active');
          elPlanBtn.textContent = 'График';
          elPlanExitBtn.style.display = 'none';
        }
      }

      function renderPlanDaysList() {

        elPlanTab20.classList.toggle('active', planModalTab === '20');
        elPlanTab365s.classList.toggle('active', planModalTab === '365s');
        elPlanTab365c.classList.toggle('active', planModalTab === '365c');

        const isYearly = (planModalTab === '365s' || planModalTab === '365c');

              '<div class="plan-day-info">' +
                '<div class="plan-line-row"><span class="plan-line-badge">Осн.</span>' + escapeHtml(item.ml) + '</div>' +
                '<div class="plan-line-row wisdom"><span class="plan-line-badge">Мудр.</span>' + escapeHtml(item.wl) + '</div>' +
              '</div>';
          } else if (planModalTab === '20') {
            btn.innerHTML =
              '<div class="plan-day-num"><span>ДЕНЬ</span><span>' + dayStr + '</span></div>' +
              '<div class="plan-day-info">' +
                '<div class="plan-line-row">' + escapeHtml(item.ml) + '</div>' +
                '<div class="plan-line-row sub">' + escapeHtml(item.sub) + '</div>' +
              '</div>';
          } else if (planModalTab === '365s') {
            btn.innerHTML =
              '<div class="plan-day-num"><span>ДЕНЬ</span><span>' + dayStr + '</span></div>' +
              '<div class="plan-day-info"><div class="plan-line-row">' + escapeHtml(item.ml) + '</div></div>';
          } else {
            btn.innerHTML =
              '<div class="plan-day-num"><span>ДЕНЬ</span><span>' + dayStr + '</span></div>' +
              '<div class="plan-day-info">' +
                '<div class="plan-line-row"><span class="plan-line-badge">ВЗ</span>' + escapeHtml(item.otl) + '</div>' +
                '<div class="plan-line-row nt"><span class="plan-line-badge">НЗ</span>' + escapeHtml(item.ntl) + '</div>' +
              '</div>';

          btn.addEventListener('click', () => activatePlanDay(planModalTab, item.day));
