        }

        elPlanDaysList.appendChild(frag);
        const activeCard = elPlanDaysList.querySelector('.plan-day-card.active');
        if (activeCard) activeCard.scrollIntoView({ block: 'center' });
        else elPlanDaysList.scrollTop = 0;
      }

      function openPlanModal() {
        if (planActive) planModalTab = planType;
        renderPlanDaysList();
        elPlanModalBackdrop.classList.add('open');
      }

      function closePlanModal() {
        elPlanModalBackdrop.classList.remove('open');
      }

      // --- ИНДЕКСАЦИЯ И НАВИГАЦИЯ ---
      function buildNavigationIndex() {
        bookChaptersSorted = {};
        chapterVersesSorted = {};
        for (let bi = 0; bi < booksOrder.length; bi++) {
          const b = booksOrder[bi];
          const chObj = bibleData[b] || {};
          const chKeys = Object.keys(chObj).map(Number).sort((a, z) => a - z);
          bookChaptersSorted[b] = chKeys;
          chapterVersesSorted[b] = {};
          for (let ci = 0; ci < chKeys.length; ci++) {
            const c = chKeys[ci];
            const vObj = chObj[c] || {};
            chapterVersesSorted[b][c] = Object.keys(vObj).map(Number).sort((a, z) => a - z);
          }
        }
      }

      function getNextVerseRef(b, c, v) {
        if (planActive) {
          const line = getActivePlanLineObj();
          if (!line) return null;
          const idx = line.indexMap.get(b + '_' + c + '_' + v);
          if (idx === undefined || idx + 1 >= line.verses.length) return null;
          return line.verses[idx + 1];
        }

        const vList = (chapterVersesSorted[b] && chapterVersesSorted[b][c]) ? chapterVersesSorted[b][c] : [];
        const vi = vList.indexOf(v);
        if (vi !== -1 && vi + 1 < vList.length) return { b: b, c: c, v: vList[vi + 1] };

        const cList = bookChaptersSorted[b] || [];
        const ci = cList.indexOf(c);
        if (ci !== -1 && ci + 1 < cList.length) {
          const nc = cList[ci + 1];
          const nvList = (chapterVersesSorted[b] && chapterVersesSorted[b][nc]) ? chapterVersesSorted[b][nc] : [];
          if (nvList.length) return { b: b, c: nc, v: nvList[0] };
        }

        const bi = booksOrder.indexOf(b);
        if (bi !== -1 && bi + 1 < booksOrder.length) {
          const nb = booksOrder[bi + 1];
          const ncList = bookChaptersSorted[nb] || [];
          if (ncList.length) {
            const fc = ncList[0];
            const nvList = (chapterVersesSorted[nb] && chapterVersesSorted[nb][fc]) ? chapterVersesSorted[nb][fc] : [];
            if (nvList.length) return { b: nb, c: fc, v: nvList[0] };
          }
        }
        return null;
      }

      function getPrevVerseRef(b, c, v) {
        if (planActive) {
          const line = getActivePlanLineObj();
          if (!line) return null;
          const idx = line.indexMap.get(b + '_' + c + '_' + v);
          if (idx === undefined || idx <= 0) return null;
          return line.verses[idx - 1];
        }

        const vList = (chapterVersesSorted[b] && chapterVersesSorted[b][c]) ? chapterVersesSorted[b][c] : [];
        const vi = vList.indexOf(v);
        if (vi > 0) return { b: b, c: c, v: vList[vi - 1] };

        const cList = bookChaptersSorted[b] || [];
        const ci = cList.indexOf(c);
        if (ci > 0) {
          const pc = cList[ci - 1];
          const pvList = (chapterVersesSorted[b] && chapterVersesSorted[b][pc]) ? chapterVersesSorted[b][pc] : [];
          if (pvList.length) return { b: b, c: pc, v: pvList[pvList.length - 1] };
        }

        const bi = booksOrder.indexOf(b);
        if (bi > 0) {
          const pb = booksOrder[bi - 1];
          const pcList = bookChaptersSorted[pb] || [];
          if (pcList.length) {
            const lc = pcList[pcList.length - 1];
            const pvList = (chapterVersesSorted[pb] && chapterVersesSorted[pb][lc]) ? chapterVersesSorted[pb][lc] : [];
            if (pvList.length) return { b: pb, c: lc, v: pvList[pvList.length - 1] };
          }
        }
        return null;
      }

      function getNextWordPos(b, c, v, wIdx) {
        const words = getVerseWordsCached(b, c, v);
        if (wIdx + 1 < words.length) return { b: b, c: c, v: v, wIdx: wIdx + 1, text: words[wIdx + 1] };
        const nv = getNextVerseRef(b, c, v);
        if (!nv) return null;
        const nWords = getVerseWordsCached(nv.b, nv.c, nv.v);
        return { b: nv.b, c: nv.c, v: nv.v, wIdx: 0, text: nWords[0] };
      }

      function getPrevWordPos(b, c, v, wIdx) {
        const words = getVerseWordsCached(b, c, v);
        if (wIdx > 0) return { b: b, c: c, v: v, wIdx: wIdx - 1, text: words[wIdx - 1] };
        const pv = getPrevVerseRef(b, c, v);
        if (!pv) return null;
        const pWords = getVerseWordsCached(pv.b, pv.c, pv.v);
        return { b: pv.b, c: pv.c, v: pv.v, wIdx: pWords.length - 1, text: pWords[pWords.length - 1] };
      }

      function getAllowedChapters(bookId) {
        if (planActive) {
          const line = getActivePlanLineObj();
          return (line && line.chaptersByBook[bookId]) ? line.chaptersByBook[bookId] : [];
        }
        return bookChaptersSorted[bookId] || [];
      }

      function getAllowedVerses(bookId, chapNum) {
        if (planActive) {
          const line = getActivePlanLineObj();
          return (line && line.versesByBookChap[bookId + '_' + chapNum]) ? line.versesByBookChap[bookId + '_' + chapNum] : [];
        }
        return (chapterVersesSorted[bookId] && chapterVersesSorted[bookId][chapNum]) ? chapterVersesSorted[bookId][chapNum] : [];
      }

      function recalculateChapterTotals() {
        chapterBlockOffsets = {};
        chapterWordOffsets = {};
        chapterTotalBlocks = 0;
        chapterTotalWords = 0;
        const vList = getAllowedVerses(currentBook, currentChapter);
        for (let i = 0; i < vList.length; i++) {
          const v = vList[i];
          const raw = (bibleData[currentBook] && bibleData[currentBook][currentChapter] && bibleData[currentBook][currentChapter][v]) ? bibleData[currentBook][currentChapter][v] : '';
          chapterBlockOffsets[v] = chapterTotalBlocks;
          chapterWordOffsets[v] = chapterTotalWords;
          chapterTotalBlocks += splitIntoSemanticBlocks(raw).length;
          chapterTotalWords += getVerseWordsCached(currentBook, currentChapter, v).length;
        }
        chapterTotalBlocks = Math.max(1, chapterTotalBlocks);
        chapterTotalWords = Math.max(1, chapterTotalWords);
      }

      function populateBookSelector() {
        elBookSel.innerHTML = '';
        const line = getActivePlanLineObj();
        const allowedBooks = planActive ? (line ? line.books : []) : booksOrder;
        for (let i = 0; i < allowedBooks.length; i++) {
          const b = allowedBooks[i];
          const opt = document.createElement('option');
          opt.value = String(b);
          opt.textContent = booksNames[b] || ('Книга ' + b);
          elBookSel.appendChild(opt);
        }
        if (allowedBooks.length) {
          if (!allowedBooks.includes(currentBook)) currentBook = allowedBooks[0];
          elBookSel.value = String(currentBook);
          populateChapterSelector();
        }
      }

      function populateChapterSelector() {
        elChapSel.innerHTML = '';
        const chList = getAllowedChapters(currentBook);
        for (let i = 0; i < chList.length; i++) {
          const c = chList[i];
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'Гл. ' + c;
          elChapSel.appendChild(opt);
        }
        if (chList.length) {
          if (!chList.includes(currentChapter)) currentChapter = chList[0];
          elChapSel.value = currentChapter;
          recalculateChapterTotals();
          populateVerseSelector();
        }
      }

      function populateVerseSelector() {
        elVerseSel.innerHTML = '';
        const vList = getAllowedVerses(currentBook, currentChapter);
        for (let i = 0; i < vList.length; i++) {
          const v = vList[i];
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = 'Ст. ' + v;
          elVerseSel.appendChild(opt);
        }
        if (vList.length) {
          if (!vList.includes(currentVerse)) currentVerse = vList[0];
          elVerseSel.value = currentVerse;
        }
        rebuildCurrentVerseUnits();
      }

      function rebuildCurrentVerseUnits() {
        const raw = (bibleData[currentBook] && bibleData[currentBook][currentChapter] && bibleData[currentBook][currentChapter][currentVerse]) ? bibleData[currentBook][currentChapter][currentVerse] : '';
        currentBlocks = splitIntoSemanticBlocks(raw);
        currentBlockIdx = Math.max(0, Math.min(currentBlockIdx, currentBlocks.length - 1));
        currentWords = getVerseWordsCached(currentBook, currentChapter, currentVerse);
        currentWordIdx = Math.max(0, Math.min(currentWordIdx, currentWords.length - 1));
      }

      function syncSelectorsToCurrent() {
        if (elBookSel.value !== String(currentBook)) {
          elBookSel.value = String(currentBook);
        }
        populateChapterSelector();
      }

      function advanceChapter(delta) {
        const chList = getAllowedChapters(currentBook);
        const pos = chList.indexOf(currentChapter);
        if (pos === -1) return false;
        const nextPos = pos + delta;
        if (nextPos >= 0 && nextPos < chList.length) {
          currentChapter = chList[nextPos];
          elChapSel.value = currentChapter;
          const nextVList = getAllowedVerses(currentBook, currentChapter);
          currentVerse = nextVList.length ? nextVList[0] : 1;
          currentBlockIdx = 0;
          currentWordIdx = 0;
          recalculateChapterTotals();
          populateVerseSelector();
          return true;
        }

        const line = getActivePlanLineObj();
        const bookList = planActive ? (line ? line.books : []) : booksOrder;
        const bi = bookList.indexOf(currentBook);
        if (delta > 0 && bi !== -1 && bi + 1 < bookList.length) {
          currentBook = bookList[bi + 1];
          const ncList = getAllowedChapters(currentBook);
          currentChapter = ncList.length ? ncList[0] : 1;
          const nvList = getAllowedVerses(currentBook, currentChapter);
          currentVerse = nvList.length ? nvList[0] : 1;
          currentBlockIdx = 0;
          currentWordIdx = 0;
          syncSelectorsToCurrent();
          return true;
        } else if (delta < 0 && bi > 0) {
          currentBook = bookList[bi - 1];
          const pcList = getAllowedChapters(currentBook);
          currentChapter = pcList.length ? pcList[pcList.length - 1] : 1;
          const pvList = getAllowedVerses(currentBook, currentChapter);
          currentVerse = pvList.length ? pvList[0] : 1;
          currentBlockIdx = 0;
          currentWordIdx = 0;
          syncSelectorsToCurrent();
          return true;
        }
        return false;
      }

      function advanceVerse(delta) {
        const nextRef = delta > 0
          ? getNextVerseRef(currentBook, currentChapter, currentVerse)
          : getPrevVerseRef(currentBook, currentChapter, currentVerse);
        if (!nextRef) return false;

        const bookChanged = nextRef.b !== currentBook;
        const chapChanged = bookChanged || nextRef.c !== currentChapter;

        currentBook = nextRef.b;
        currentChapter = nextRef.c;
        currentVerse = nextRef.v;

        if (bookChanged) {
          syncSelectorsToCurrent();
        } else if (chapChanged) {
          elChapSel.value = currentChapter;
          recalculateChapterTotals();
          populateVerseSelector();
        } else {
          elVerseSel.value = currentVerse;
          rebuildCurrentVerseUnits();
        }
        return true;
      }

      function stepForward() {
        if (displayMode === 'BLOCKS') {
          if (currentBlockIdx + 1 < currentBlocks.length) {
            currentBlockIdx++;
            refreshView();
            return true;
          } else if (advanceVerse(1)) {
            currentBlockIdx = 0;
            refreshView();
            return true;
          }
        } else if (displayMode === 'WORDS') {
          if (currentWordIdx + 1 < currentWords.length) {
            currentWordIdx++;
            refreshView();
            return true;
          } else if (advanceVerse(1)) {
            currentWordIdx = 0;
            refreshView();
            return true;
          }
        } else if (displayMode === 'VERSES') {
          if (advanceVerse(1)) {
            refreshView();
            return true;
          }
        } else if (displayMode === 'CHAPTERS') {
          if (advanceChapter(1)) {
            refreshView();
            return true;
          }
        }
        return false;
      }

      function stepBackward() {
        if (displayMode === 'BLOCKS') {
          if (currentBlockIdx > 0) {
            currentBlockIdx--;
            refreshView();
            return true;
          } else if (advanceVerse(-1)) {
            currentBlockIdx = Math.max(0, currentBlocks.length - 1);
            refreshView();
            return true;
          }
        } else if (displayMode === 'WORDS') {
          if (currentWordIdx > 0) {
            currentWordIdx--;
            refreshView();
            return true;
          } else if (advanceVerse(-1)) {
            currentWordIdx = Math.max(0, currentWords.length - 1);
            refreshView();
            return true;
          }
        } else if (displayMode === 'VERSES') {
          if (advanceVerse(-1)) {
            refreshView();
            return true;
          }
        } else if (displayMode === 'CHAPTERS') {
          if (advanceChapter(-1)) {
            refreshView();
            return true;
          }
        }
        return false;
      }

      // --- НЕОНОВЫЕ ГРАНИЦЫ ДЛЯ ЛЕНТ ---
      function createNeonGateEl(type, customLabel) {
        const gate = document.createElement('span');
        gate.className = 'neon-gate ' + type;
        const lbl = customLabel || (type === 'start' ? 'СТАРТ' : 'ФИНИШ');
        gate.innerHTML = '<span class="neon-gate-line"></span><span class="neon-gate-tag">' + escapeHtml(lbl) + '</span>';
        return gate;
      }

      // --- ДВИЖОК БЕСКОНЕЧНОЙ БЕГУЩЕЙ СТРОКИ (TICKER) ---
      function getTickerBufferPx() {
        const visibleWorldW = (elWorkspace.clientWidth || window.innerWidth) / Math.max(TICKER_MIN_ZOOM, canvasZoom);
        return Math.max(2400, Math.ceil(visibleWorldW * 0.95));
      }

      function createTickerSpan(pos) {
        const span = document.createElement('span');
        span.className = 'ticker-item';
        if (pos.wIdx === 0) {
          const subLbl = getSubBoundaryLabelAt(pos.b, pos.c, pos.v);
          if (subLbl) span.appendChild(createNeonGateEl('mid', subLbl));
          const tag = document.createElement('span');
          tag.className = 'ticker-vtag';
          tag.textContent = String(pos.v);
          span.appendChild(tag);
        }
        span.appendChild(document.createTextNode(pos.text));
        return span;
      }

      function calibrateTickerWordPx() {
        const probe = document.createElement('span');
        probe.className = 'ticker-item';
        probe.style.visibility = 'hidden';
        probe.style.position = 'absolute';
        probe.textContent = 'словом';
        elTickerTape.appendChild(probe);
        const w = probe.offsetWidth;
        probe.remove();
        if (w > 40) tickerAvgWordPx = w;
      }

      function rebuildTickerFromCurrent() {
        elTickerTape.innerHTML = '';
        tickerItems = [];
        tickerTotalWidth = 0;
        tickerStartGateEl = null;
        tickerEndGateEl = null;
        tickerStartGateW = 0;
        tickerEndGateW = 0;

        calibrateTickerWordPx();

        const startText = currentWords[currentWordIdx] || '—';
        const centerPos = {
          b: currentBook,
          c: currentChapter,
          v: currentVerse,
          wIdx: currentWordIdx,
          text: startText
        };

        const centerEl = createTickerSpan(centerPos);
        elTickerTape.appendChild(centerEl);
        const centerW = centerEl.offsetWidth;
        tickerItems.push({ b: centerPos.b, c: centerPos.c, v: centerPos.v, wIdx: centerPos.wIdx, text: centerPos.text, el: centerEl, width: centerW });
        tickerTotalWidth = centerW;
        tickerScrollX = -centerW * 0.5;

        fillTickerBuffers();
        elTickerTape.style.transform = 'translate3d(' + tickerScrollX + 'px, -50%, 0)';
      }

      function updateTickerGates() {
        if (!tickerItems.length) return;
        const first = tickerItems[0];
        const last = tickerItems[tickerItems.length - 1];
        const atStart = planActive && !getPrevWordPos(first.b, first.c, first.v, first.wIdx);
        const atEnd = planActive && !getNextWordPos(last.b, last.c, last.v, last.wIdx);

        if (atStart && !tickerStartGateEl) {
          tickerStartGateEl = createNeonGateEl('start', '');
          elTickerTape.insertBefore(tickerStartGateEl, elTickerTape.firstChild);
          tickerStartGateW = tickerStartGateEl.offsetWidth + 44;
          tickerScrollX -= tickerStartGateW;
        } else if (!atStart && tickerStartGateEl) {
          tickerStartGateEl.remove();
          tickerStartGateEl = null;
          tickerScrollX += tickerStartGateW;
          tickerStartGateW = 0;
        }

        if (atEnd && !tickerEndGateEl) {
          tickerEndGateEl = createNeonGateEl('end', '');
          elTickerTape.appendChild(tickerEndGateEl);
          tickerEndGateW = tickerEndGateEl.offsetWidth + 44;
        } else if (!atEnd && tickerEndGateEl) {
          tickerEndGateEl.remove();
          tickerEndGateEl = null;
          tickerEndGateW = 0;
        }
      }

      function fillTickerBuffers() {
        if (!tickerItems.length) return;
        const bufPx = getTickerBufferPx();

        while ((tickerTotalWidth + tickerStartGateW + tickerScrollX) < bufPx) {
          const last = tickerItems[tickerItems.length - 1];
          const nextPos = getNextWordPos(last.b, last.c, last.v, last.wIdx);
          if (!nextPos) break;
          const el = createTickerSpan(nextPos);
          if (tickerEndGateEl) elTickerTape.insertBefore(el, tickerEndGateEl);
          else elTickerTape.appendChild(el);
          const w = el.offsetWidth;
          tickerItems.push({ b: nextPos.b, c: nextPos.c, v: nextPos.v, wIdx: nextPos.wIdx, text: nextPos.text, el: el, width: w });
          tickerTotalWidth += w;
        }

        while ((-(tickerScrollX + tickerStartGateW)) < bufPx) {
          const first = tickerItems[0];
          const prevPos = getPrevWordPos(first.b, first.c, first.v, first.wIdx);
          if (!prevPos) break;
          const el = createTickerSpan(prevPos);
          if (tickerStartGateEl) elTickerTape.insertBefore(el, tickerStartGateEl.nextSibling);
          else elTickerTape.insertBefore(el, elTickerTape.firstChild);
          const w = el.offsetWidth;
          tickerItems.unshift({ b: prevPos.b, c: prevPos.c, v: prevPos.v, wIdx: prevPos.wIdx, text: prevPos.text, el: el, width: w });
          tickerTotalWidth += w;
          tickerScrollX -= w;
        }

        while (tickerItems.length > 16 && ((-(tickerScrollX + tickerStartGateW)) - tickerItems[0].width) > bufPx + 700) {
          const removed = tickerItems.shift();
          removed.el.remove();
          tickerScrollX += removed.width;
          tickerTotalWidth -= removed.width;
        }

        while (tickerItems.length > 16 && ((tickerTotalWidth + tickerStartGateW + tickerScrollX) - tickerItems[tickerItems.length - 1].width) > bufPx + 700) {
          const removed = tickerItems.pop();
          removed.el.remove();
          tickerTotalWidth -= removed.width;
        }

        updateTickerGates();
      }

      function syncCurrentFromTickerCenter() {
        if (!tickerItems.length) return;
        let acc = tickerScrollX + tickerStartGateW;
        let found = tickerItems[tickerItems.length - 1];
        for (let i = 0; i < tickerItems.length; i++) {
          const item = tickerItems[i];
          if (acc + item.width >= 0) {
            found = item;
            break;
          }
          acc += item.width;
        }

        if (
          found.b === currentBook &&
          found.c === currentChapter &&
          found.v === currentVerse &&
          found.wIdx === currentWordIdx
        ) {
          return;
        }

        const bookChanged = found.b !== currentBook;
        const chapChanged = bookChanged || found.c !== currentChapter;
        const verseChanged = chapChanged || found.v !== currentVerse;

        currentBook = found.b;
        currentChapter = found.c;
        currentVerse = found.v;
        currentWordIdx = found.wIdx;

        if (bookChanged) {
          elBookSel.value = String(currentBook);
          elChapSel.innerHTML = '';
          const chs = getAllowedChapters(currentBook);
          for (let i = 0; i < chs.length; i++) {
            const opt = document.createElement('option');
            opt.value = chs[i];
            opt.textContent = 'Гл. ' + chs[i];
            elChapSel.appendChild(opt);
          }
        }
        if (chapChanged) {
          elChapSel.value = currentChapter;
          recalculateChapterTotals();
          elVerseSel.innerHTML = '';
          const vs = getAllowedVerses(currentBook, currentChapter);
          for (let i = 0; i < vs.length; i++) {
            const opt = document.createElement('option');
            opt.value = vs[i];
            opt.textContent = 'Ст. ' + vs[i];
            elVerseSel.appendChild(opt);
          }
        }
        if (verseChanged) {
          elVerseSel.value = currentVerse;
          currentWords = getVerseWordsCached(currentBook, currentChapter, currentVerse);
        }

        updateProgressBars();
        updateStatusBar();
      }

      // --- ЕДИНЫЙ СОВЕТСКИЙ ПРИБОР ---
      function getActiveSpeedWpm() {
        return displayMode === 'WORDS' ? wordsWpm : tickerWpm;
      }

      function setActiveSpeedWpm(val) {
        if (displayMode === 'WORDS') wordsWpm = val;
        else tickerWpm = val;
      }

      function isActiveAutoRunning() {
        return displayMode === 'WORDS' ? wordsAutoRunning : tickerAutoRunning;
      }

      function toggleActiveAutoRunning() {
        if (displayMode === 'WORDS') {
          wordsAutoRunning = !wordsAutoRunning;
          wordsAccum = 0;
          wordsLastTime = performance.now();
        } else if (displayMode === 'TICKER') {
          tickerAutoRunning = !tickerAutoRunning;
        }
        updateSovietGaugeUI();
        updateStatusBar();
      }

      function updateSovietGaugeUI() {
        const wpm = getActiveSpeedWpm();
        const running = isActiveAutoRunning();
        elGaugeWpmVal.textContent = String(wpm);
        const t = (wpm - SPEED_MIN_WPM) / (SPEED_MAX_WPM - SPEED_MIN_WPM);
        const deg = -82 + t * 164;
        elGaugeNeedle.style.transform = 'rotate(' + deg.toFixed(1) + 'deg)';

        elTickerInvertBtn.style.display = displayMode === 'TICKER' ? 'inline-flex' : 'none';
        elTickerInvertBtn.classList.toggle('active', tickerInverted);

        if (running) {
          elSpeedPlayBtn.innerHTML = SVG_PAUSE;
          elSpeedPlayBtn.classList.add('running');
        } else {
          elSpeedPlayBtn.innerHTML = SVG_PLAY;
          elSpeedPlayBtn.classList.remove('running');
        }
      }

      // --- iOS-РУЛЕТКА СКОРОСТИ ---
      function buildIosSpeedRuler() {
        elIosRulerTrack.innerHTML = '';
        rulerTickEls = [];
        for (let w = SPEED_MIN_WPM; w <= SPEED_MAX_WPM; w += SPEED_STEP_WPM) {
          const tick = document.createElement('div');
          const isMajor = (w % 50 === 0);
          tick.className = 'ios-tick' + (isMajor ? ' major' : '');
          if (isMajor) {
            const num = document.createElement('span');
            num.className = 'ios-tick-num';
            num.textContent = String(w);
            tick.appendChild(num);
          }
          const bar = document.createElement('div');
          bar.className = 'ios-tick-bar';
          tick.appendChild(bar);
          elIosRulerTrack.appendChild(tick);
          rulerTickEls.push({ wpm: w, el: tick });
        }
      }

      function setRulerPositionFromWpm(wpm, smooth) {
        const clamped = Math.max(SPEED_MIN_WPM, Math.min(SPEED_MAX_WPM, Math.round(wpm / SPEED_STEP_WPM) * SPEED_STEP_WPM));
        rulerTempWpm = clamped;
        const idx = (clamped - SPEED_MIN_WPM) / SPEED_STEP_WPM;
        rulerOffset = -(idx * RULER_TICK_PX + RULER_TICK_PX * 0.5);
        elIosRulerTrack.style.transition = smooth ? 'transform 0.14s ease-out' : 'none';
        elIosRulerTrack.style.transform = 'translate3d(' + rulerOffset + 'px, 0, 0)';
        highlightRulerTick(idx);
      }

      function highlightRulerTick(activeIdx) {
        elIosBigWpm.textContent = String(rulerTempWpm);
        for (let i = 0; i < rulerTickEls.length; i++) {
          rulerTickEls[i].el.classList.toggle('selected', i === activeIdx);
        }
      }

      function openIosSpeedPicker() {
        elIosBackdrop.classList.add('open');
        setRulerPositionFromWpm(getActiveSpeedWpm(), false);
      }

      function closeIosSpeedPicker() {
        elIosBackdrop.classList.remove('open');
      }

      function handleRulerStart(clientX) {
        rulerDragging = true;
        rulerStartX = clientX;
        rulerStartOffset = rulerOffset;
        elIosRulerTrack.style.transition = 'none';
      }

      function handleRulerMove(clientX) {
        if (!rulerDragging) return;
        const dx = clientX - rulerStartX;
        const maxIdx = rulerTickEls.length - 1;
        const minOff = -(maxIdx * RULER_TICK_PX + RULER_TICK_PX * 0.5);
        const maxOff = -(RULER_TICK_PX * 0.5);
        rulerOffset = Math.max(minOff, Math.min(maxOff, rulerStartOffset + dx));
        elIosRulerTrack.style.transform = 'translate3d(' + rulerOffset + 'px, 0, 0)';

        const idx = Math.max(0, Math.min(maxIdx, Math.round((-rulerOffset - RULER_TICK_PX * 0.5) / RULER_TICK_PX)));
        rulerTempWpm = SPEED_MIN_WPM + idx * SPEED_STEP_WPM;
        highlightRulerTick(idx);
      }

      function handleRulerEnd() {
        if (!rulerDragging) return;
        rulerDragging = false;
        setRulerPositionFromWpm(rulerTempWpm, true);
      }

      elIosRulerViewport.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length) handleRulerStart(e.touches[0].clientX);
      }, { passive: false });
      elIosRulerViewport.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length) handleRulerMove(e.touches[0].clientX);
      }, { passive: false });
      elIosRulerViewport.addEventListener('touchend', () => handleRulerEnd());

      elIosRulerViewport.addEventListener('mousedown', (e) => handleRulerStart(e.clientX));
      window.addEventListener('mousemove', (e) => { if (rulerDragging) handleRulerMove(e.clientX); });
      window.addEventListener('mouseup', () => handleRulerEnd());

      elSovietGaugeBtn.addEventListener('click', openIosSpeedPicker);
      elIosBackdrop.addEventListener('click', (e) => {
        if (e.target === elIosBackdrop) closeIosSpeedPicker();
      });
      elIosConfirmBtn.addEventListener('click', () => {
        setActiveSpeedWpm(rulerTempWpm);
        updateSovietGaugeUI();
        updateStatusBar();
        closeIosSpeedPicker();
      });

      elSpeedPlayBtn.addEventListener('click', toggleActiveAutoRunning);

      elTickerInvertBtn.addEventListener('click', () => {
        tickerInverted = !tickerInverted;
        updateSovietGaugeUI();
        updateStatusBar();
      });

      // --- ОТРИСОВКА ---
      function getPlanShortTag() {
        if (!planActive) return '';
        const sec = getActivePlanSection();
        const secLbl = (sec && planSections.length > 1) ? (' • ' + sec.label) : '';
        return 'День ' + planDayNum + secLbl;
      }

      function updateProgressBars() {
        const bookTitle = booksNames[currentBook] || 'Книга';
        const pTag = getPlanShortTag();
        if (displayMode === 'BLOCKS') {
          elBlockProgBox.style.display = 'flex';
          const passed = (chapterBlockOffsets[currentVerse] || 0) + currentBlockIdx;
          const ratio = chapterTotalBlocks <= 1 ? 1 : passed / (chapterTotalBlocks - 1);
          const pct = Math.max(0, Math.min(100, ratio * 100));
          elBlockProgFill.style.width = pct + '%';
          elBlockProgLbl.textContent = 'Глава ' + currentChapter + ' — ' + Math.round(pct) + '%  (' + (passed + 1) + ' / ' + chapterTotalBlocks + ' бл.)';
        } else if (displayMode === 'WORDS' || displayMode === 'TICKER') {
          elBlockProgBox.style.display = 'none';
          elHudRef.textContent = bookTitle + ' ' + currentChapter + ':' + currentVerse + (pTag ? '  •  ' + pTag : '');

          const passedCh = (chapterWordOffsets[currentVerse] || 0) + currentWordIdx;
          const ratioCh = chapterTotalWords <= 1 ? 1 : passedCh / (chapterTotalWords - 1);
          const pctCh = Math.max(0, Math.min(100, ratioCh * 100));
          elHudChFill.style.width = pctCh + '%';
          elHudChLbl.textContent = 'Гл. ' + currentChapter + ' — ' + Math.round(pctCh) + '% (' + (passedCh + 1) + '/' + chapterTotalWords + ')';

          const totalV = Math.max(1, currentWords.length);
          const ratioV = totalV <= 1 ? 1 : currentWordIdx / (totalV - 1);
          const pctV = Math.max(0, Math.min(100, ratioV * 100));
          elHudVFill.style.width = pctV + '%';
          elHudVLbl.textContent = 'Ст. ' + currentVerse + ' — ' + Math.round(pctV) + '% (' + (currentWordIdx + 1) + '/' + totalV + ')';
        } else {
          elBlockProgBox.style.display = 'none';
        }
      }

      function collectWordWindow(radius) {
        const leftItems = [];
        let lb = currentBook, lc = currentChapter, lv = currentVerse;
        let lwIdx = currentWordIdx - 1;
        let lWords = currentWords;
        let hitStart = false;

        while (leftItems.length < radius) {
          if (lwIdx >= 0) {
            leftItems.push({
              text: lWords[lwIdx],
              vtag: lwIdx === 0 ? String(lv) : '',
              subGate: lwIdx === 0 ? getSubBoundaryLabelAt(lb, lc, lv) : ''
            });
            lwIdx--;
          } else {
            const prev = getPrevVerseRef(lb, lc, lv);
            if (!prev) { hitStart = true; break; }
            lb = prev.b; lc = prev.c; lv = prev.v;
            lWords = getVerseWordsCached(lb, lc, lv);
            lwIdx = lWords.length - 1;
          }
        }
        if (!hitStart && lwIdx < 0 && !getPrevVerseRef(lb, lc, lv)) hitStart = true;
        leftItems.reverse();

        const rightItems = [];
        let rb = currentBook, rc = currentChapter, rv = currentVerse;
        let rwIdx = currentWordIdx + 1;
        let rWords = currentWords;
        let hitEnd = false;

        while (rightItems.length < radius) {
          if (rwIdx < rWords.length) {
            rightItems.push({
              text: rWords[rwIdx],
              vtag: rwIdx === 0 ? String(rv) : '',
              subGate: rwIdx === 0 ? getSubBoundaryLabelAt(rb, rc, rv) : ''
            });
            rwIdx++;
          } else {
            const next = getNextVerseRef(rb, rc, rv);
            if (!next) { hitEnd = true; break; }
            rb = next.b; rc = next.c; rv = next.v;
            rWords = getVerseWordsCached(rb, rc, rv);
            rwIdx = 0;
          }
        }
        if (!hitEnd && rwIdx >= rWords.length && !getNextVerseRef(rb, rc, rv)) hitEnd = true;

        return {
          left: leftItems,
          active: currentWords[currentWordIdx] || '—',
          activeVtag: currentWordIdx === 0 ? String(currentVerse) : '',
          activeSubGate: currentWordIdx === 0 ? getSubBoundaryLabelAt(currentBook, currentChapter, currentVerse) : '',
          right: rightItems,
          hitStart: hitStart,
          hitEnd: hitEnd
        };
      }

      function renderContinuousWordStream() {
        const win = collectWordWindow(WORD_WINDOW_RADIUS);
        const frag = document.createDocumentFragment();

        if (planActive && win.hitStart) frag.appendChild(createNeonGateEl('start', ''));

        for (let i = 0; i < win.left.length; i++) {
          const item = win.left[i];
          if (item.subGate) frag.appendChild(createNeonGateEl('mid', item.subGate));
          if (item.vtag) {
            const t = document.createElement('span');
            t.className = 'stream-vtag';
            t.textContent = item.vtag;
            frag.appendChild(t);
          }
          const s = document.createElement('span');
          s.className = 'stream-word read';
          s.textContent = item.text;
          frag.appendChild(s);
        }

        if (win.activeSubGate) frag.appendChild(createNeonGateEl('mid', win.activeSubGate));
        if (win.activeVtag) {
          const t = document.createElement('span');
          t.className = 'stream-vtag';
          t.textContent = win.activeVtag;
          frag.appendChild(t);
        }
        const activeEl = document.createElement('span');
        activeEl.className = 'stream-word active';
        activeEl.textContent = win.active;
        frag.appendChild(activeEl);

        for (let i = 0; i < win.right.length; i++) {
          const item = win.right[i];
          if (item.subGate) frag.appendChild(createNeonGateEl('mid', item.subGate));
          if (item.vtag) {
            const t = document.createElement('span');
            t.className = 'stream-vtag';
            t.textContent = item.vtag;
            frag.appendChild(t);
          }
          const s = document.createElement('span');
          s.className = 'stream-word next';
          s.textContent = item.text;
          frag.appendChild(s);
        }

        if (planActive && win.hitEnd) frag.appendChild(createNeonGateEl('end', ''));

        elWordTape.innerHTML = '';
        elWordTape.appendChild(frag);

        const activeCenter = activeEl.offsetLeft + activeEl.offsetWidth * 0.5;
        elWordTape.style.transform = 'translate3d(' + (-activeCenter) + 'px, -50%, 0)';
      }

      function updateStatusBar() {
        const zoomPct = Math.round(canvasZoom * 100);
        const pTag = getPlanShortTag();
        const planInfo = pTag ? (pTag + '  •  ') : '';
        if (displayMode === 'BLOCKS') {
          elStatusBar.textContent = planInfo + 'Блок ' + (currentBlockIdx + 1) + '/' + currentBlocks.length + ' (Ст. ' + currentVerse + ')  •  Зум ' + zoomPct + '%';
        } else if (displayMode === 'WORDS') {
          const autoSt = wordsAutoRunning ? ('Авто ' + wordsWpm + ' сл/мин') : ('Тап слева/справа (' + wordsWpm + ' сл/мин)');
          elStatusBar.textContent = planInfo + autoSt + '  •  Зум ' + zoomPct + '%';
        } else if (displayMode === 'TICKER') {
          const invHint = tickerInverted ? 'Инверсия ⇄' : 'Справа → / Слева ←';
          const st = tickerAutoRunning ? ('Авто ' + tickerWpm + ' сл/мин') : (invHint + ' (' + tickerWpm + ' сл/мин)');
          elStatusBar.textContent = planInfo + st + '  •  Зум ' + zoomPct + '%';
        } else if (displayMode === 'VERSES') {
          elStatusBar.textContent = planInfo + 'Стих ' + currentVerse + '  •  Зум ' + zoomPct + '%';
        } else {
          elStatusBar.textContent = planInfo + 'Глава ' + currentChapter + '  •  Свайп вверх/вниз для чтения';
        }
      }

      function refreshView() {
        const bookTitle = booksNames[currentBook] || 'Книга';
        const vObj = (bibleData[currentBook] && bibleData[currentBook][currentChapter]) ? bibleData[currentBook][currentChapter] : {};
        const vList = getAllowedVerses(currentBook, currentChapter);

        const isChapter = displayMode === 'CHAPTERS';
        const isWords = displayMode === 'WORDS';
        const isTicker = displayMode === 'TICKER';

        elWorkspace.style.display = isChapter ? 'none' : 'block';
        elChapScroll.style.display = isChapter ? 'block' : 'none';
        elCenterBtn.style.display = isChapter ? 'none' : 'inline-flex';

        elCardStack.style.display = (!isChapter && !isWords && !isTicker) ? 'flex' : 'none';
        elWordStreamRoot.style.display = isWords ? 'block' : 'none';
        elTickerStreamRoot.style.display = isTicker ? 'block' : 'none';
        elWordHud.style.display = (isWords || isTicker) ? 'flex' : 'none';
        elSpeedDock.style.display = (isWords || isTicker) ? 'flex' : 'none';

        const wsW = elWorkspace.clientWidth || window.innerWidth;
        const cardWidth = Math.min(Math.max(300, wsW - 28), 640);
        elCardStack.style.width = cardWidth + 'px';

        elTextCard.classList.remove('bound-start', 'bound-end', 'bound-mid');

        if (displayMode === 'BLOCKS') {
          const blockStr = currentBlocks[currentBlockIdx] || '—';
          const atPlanStart = planActive && isAtPlanLineStartVerse() && currentBlockIdx === 0;
          const atPlanEnd = planActive && isAtPlanLineEndVerse() && currentBlockIdx === currentBlocks.length - 1;
          const subLbl = (planActive && currentBlockIdx === 0) ? getSubBoundaryLabelAt(currentBook, currentChapter, currentVerse) : '';
          const sec = getActivePlanSection();
          const secTitle = sec ? sec.label : ('День ' + planDayNum);

          if (atPlanStart) elTextCard.classList.add('bound-start');
          else if (atPlanEnd) elTextCard.classList.add('bound-end');
          else if (subLbl) elTextCard.classList.add('bound-mid');

          let boundBadgeHtml = '';
          if (atPlanStart) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill start">● Старт • ' + escapeHtml(secTitle) + '</span></div>';
          else if (atPlanEnd) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill end">● Финиш • ' + escapeHtml(secTitle) + '</span></div>';
          else if (subLbl) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill mid">● ' + escapeHtml(subLbl) + '</span></div>';

          const dotsHtml = currentBlocks.map((_, i) => {
            if (i === currentBlockIdx) return '<span class="dot-active">●</span>';
            if (i < currentBlockIdx) return '<span class="dot-done">•</span>';
            return '<span class="dot-todo">•</span>';
          }).join(' ');

          const ctxHtml = currentBlocks.map((b, i) => {
            const esc = escapeHtml(b);
            if (i === currentBlockIdx) return '<span class="ctx-active">' + esc + '</span>';
            if (i < currentBlockIdx) return '<span class="ctx-done">' + esc + '</span>';
            return '<span class="ctx-todo">' + esc + '</span>';
          }).join(' ');

          const adjParts = [];
          const prevRef = getPrevVerseRef(currentBook, currentChapter, currentVerse);
          const nextRef = getNextVerseRef(currentBook, currentChapter, currentVerse);
          if (prevRef && prevRef.b === currentBook && prevRef.c === currentChapter) {
            adjParts.push('<div>' + prevRef.v + '. ' + cleanVerseHtml(vObj[prevRef.v]) + '</div>');
          }
          if (nextRef && nextRef.b === currentBook && nextRef.c === currentChapter) {
            adjParts.push('<div>' + nextRef.v + '. ' + cleanVerseHtml(vObj[nextRef.v]) + '</div>');
          }

          elTextCard.innerHTML =
            boundBadgeHtml +
            '<div class="block-ref">' + escapeHtml(bookTitle) + ' ' + currentChapter + ':' + currentVerse + '</div>' +
            '<div class="block-main">' + escapeHtml(blockStr) + '</div>' +
            '<div class="block-dots">' + dotsHtml + '</div>' +
            '<div class="block-divider"></div>' +
            '<div class="block-context">' + ctxHtml + '</div>' +
            (adjParts.length ? '<div class="block-adj">' + adjParts.join('') + '</div>' : '');
        } else if (displayMode === 'WORDS') {
          renderContinuousWordStream();
          updateSovietGaugeUI();
        } else if (displayMode === 'TICKER') {
          rebuildTickerFromCurrent();
          updateSovietGaugeUI();
        } else if (displayMode === 'VERSES') {
          const atPlanStart = planActive && isAtPlanLineStartVerse();
          const atPlanEnd = planActive && isAtPlanLineEndVerse();
          const subLbl = planActive ? getSubBoundaryLabelAt(currentBook, currentChapter, currentVerse) : '';
          const sec = getActivePlanSection();
          const secTitle = sec ? sec.label : ('День ' + planDayNum);

          if (atPlanStart) elTextCard.classList.add('bound-start');
          else if (atPlanEnd) elTextCard.classList.add('bound-end');
          else if (subLbl) elTextCard.classList.add('bound-mid');

          let boundBadgeHtml = '';
          if (atPlanStart) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill start">● Старт • ' + escapeHtml(secTitle) + '</span></div>';
          else if (atPlanEnd) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill end">● Финиш • ' + escapeHtml(secTitle) + '</span></div>';
          else if (subLbl) boundBadgeHtml = '<div class="bound-pill-wrap"><span class="card-bound-pill mid">● ' + escapeHtml(subLbl) + '</span></div>';

          const raw = vObj[currentVerse] || '';
          elTextCard.innerHTML =
            boundBadgeHtml +
            '<div class="verse-ref">' + escapeHtml(bookTitle) + ' ' + currentChapter + ':' + currentVerse + '</div>' +
            '<div class="verse-body">' + cleanVerseHtml(raw) + '</div>';
        } else if (displayMode === 'CHAPTERS') {
          let html = '<div class="ch-title">' + escapeHtml(bookTitle) + ' — Глава ' + currentChapter + '</div>';
          const line = getActivePlanLineObj();
          const firstLineV = (line && line.verses.length) ? line.verses[0] : null;
          const lastLineV = (line && line.verses.length) ? line.verses[line.verses.length - 1] : null;

          if (planActive && firstLineV && firstLineV.b === currentBook && firstLineV.c === currentChapter) {
            html += '<div class="ch-neon-banner start"></div>';
          }
          for (let i = 0; i < vList.length; i++) {
            const v = vList[i];
            const subLbl = planActive ? getSubBoundaryLabelAt(currentBook, currentChapter, v) : '';
            if (subLbl) {
              html += '<div class="ch-sub-divider">' + escapeHtml(subLbl) + '</div>';
            }
            const blocks = splitIntoSemanticBlocks(vObj[v] || '');
            const joined = blocks.map(escapeHtml).join('<span class="ch-dot">·</span>');
            html += '<div class="ch-verse"><span class="ch-vnum">' + v + '</span>' + joined + '</div>';
          }
          if (planActive && lastLineV && lastLineV.b === currentBook && lastLineV.c === currentChapter) {
            html += '<div class="ch-neon-banner end"></div>';
          }
          html +=
            '<div class="ch-nav-row">' +
              '<button type="button" id="ch-prev-btn">← Пред. глава</button>' +
              '<button type="button" id="ch-next-btn">След. глава →</button>' +
            '</div>';
          elChapContainer.innerHTML = html;
          elChapScroll.scrollTop = 0;
          document.getElementById('ch-prev-btn').onclick = () => stepBackward();
          document.getElementById('ch-next-btn').onclick = () => stepForward();
        }

        if (!isChapter) updateProgressBars();
        updateStatusBar();
      }

      // --- КАМЕРА (ЗУМ И ПЕРЕМЕЩЕНИЕ ДВУМЯ ПАЛЬЦАМИ) ---
      function getMinZoomForMode() {
        if (displayMode === 'TICKER') return TICKER_MIN_ZOOM;
        if (displayMode === 'WORDS') return WORD_MIN_ZOOM;
        return 0.35;
      }

      function getMaxZoomForMode() {
        if (displayMode === 'WORDS' || displayMode === 'TICKER') return WORD_MAX_ZOOM;
        return 5.0;
      }

      function applyCamera() {
        elCanvasRoot.style.transform = 'translate3d(' + canvasPanX + 'px, ' + canvasPanY + 'px, 0) scale(' + canvasZoom + ')';
        if (displayMode === 'TICKER') {
          fillTickerBuffers();
          elTickerTape.style.transform = 'translate3d(' + tickerScrollX + 'px, -50%, 0)';
        }
        updateStatusBar();
      }

      function centerCamera(resetZoom) {
        if (resetZoom) canvasZoom = 1.0;
        requestAnimationFrame(() => {
          const wsW = elWorkspace.clientWidth;
          const wsH = elWorkspace.clientHeight;
          if (displayMode === 'WORDS' || displayMode === 'TICKER') {
            const hudH = elWordHud.offsetHeight || 0;
            canvasPanX = wsW * 0.5;
            canvasPanY = hudH + (wsH - hudH) * 0.5;
          } else {
            const stackW = elCardStack.offsetWidth * canvasZoom;
            const stackH = elCardStack.offsetHeight * canvasZoom;
            canvasPanX = (wsW - stackW) * 0.5;
            canvasPanY = Math.max(14, (wsH - stackH) * 0.45);
          }
          applyCamera();
        });
      }

      function triggerTapFlash(side) {
        if (displayMode === 'TICKER') return;
        const el = side === 'right' ? elFlashRight : elFlashLeft;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 140);
      }

      function getTickerDirForSide(isRightHalf) {
        const baseDir = isRightHalf ? 1 : -1;
        return tickerInverted ? -baseDir : baseDir;
      }

      // --- СЕНСОРНОЕ УПРАВЛЕНИЕ ---
      let singleStartX = 0, singleStartY = 0, singleStartTime = 0;
      let wasMultiTouch = false;
      let pinchPrevDist = 0, pinchPrevMidX = 0, pinchPrevMidY = 0;

      function isInteractiveTarget(target) {
        return Boolean(target && target.closest && target.closest('button, select, input, #restore-bar-btn'));
      }

      elWorkspace.addEventListener('touchstart', (e) => {
        if (isInteractiveTarget(e.target)) return;
        e.preventDefault();

        if (e.touches.length === 1 && !wasMultiTouch) {
          const rect = elWorkspace.getBoundingClientRect();
          const relX = e.touches[0].clientX - rect.left;
          singleStartX = e.touches[0].clientX;
          singleStartY = e.touches[0].clientY;
          singleStartTime = performance.now();

          if (displayMode === 'TICKER') {
            manualTickerDir = getTickerDirForSide(relX >= rect.width * 0.5);
          }
        } else if (e.touches.length === 2) {
          wasMultiTouch = true;
          manualTickerDir = 0;
          const t0 = e.touches[0], t1 = e.touches[1];
          pinchPrevDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const rect = elWorkspace.getBoundingClientRect();
          pinchPrevMidX = ((t0.clientX + t1.clientX) * 0.5) - rect.left;
          pinchPrevMidY = ((t0.clientY + t1.clientY) * 0.5) - rect.top;
        }
      }, { passive: false });

      elWorkspace.addEventListener('touchmove', (e) => {
        if (isInteractiveTarget(e.target)) return;
        e.preventDefault();

        if (e.touches.length === 2) {
          wasMultiTouch = true;
          manualTickerDir = 0;
          const t0 = e.touches[0], t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const rect = elWorkspace.getBoundingClientRect();
          const midX = ((t0.clientX + t1.clientX) * 0.5) - rect.left;
          const midY = ((t0.clientY + t1.clientY) * 0.5) - rect.top;

          if (pinchPrevDist > 0) {
            const factor = dist / pinchPrevDist;
            const newZoom = Math.max(getMinZoomForMode(), Math.min(getMaxZoomForMode(), canvasZoom * factor));

            const worldX = (pinchPrevMidX - canvasPanX) / canvasZoom;
            const worldY = (pinchPrevMidY - canvasPanY) / canvasZoom;

            canvasZoom = newZoom;
            canvasPanX = midX - worldX * canvasZoom;
            canvasPanY = midY - worldY * canvasZoom;
            applyCamera();
          }
          pinchPrevDist = dist;
          pinchPrevMidX = midX;
          pinchPrevMidY = midY;
        }
      }, { passive: false });

      elWorkspace.addEventListener('touchend', (e) => {
        if (isInteractiveTarget(e.target)) return;
        e.preventDefault();

        if (e.touches.length === 0) {
          manualTickerDir = 0;
          if (!wasMultiTouch && displayMode !== 'TICKER') {
            const t = e.changedTouches[0];
            const moved = Math.hypot(t.clientX - singleStartX, t.clientY - singleStartY);
            const dt = performance.now() - singleStartTime;
            if (moved < 24 && dt < 450) {
              const rect = elWorkspace.getBoundingClientRect();
              const relX = t.clientX - rect.left;
              if (relX >= rect.width * 0.5) {
                triggerTapFlash('right');
                stepForward();
              } else {
                triggerTapFlash('left');
                stepBackward();
              }
            }
          }
          wasMultiTouch = false;
          pinchPrevDist = 0;
        }
      }, { passive: false });

      elWorkspace.addEventListener('touchcancel', () => {
        manualTickerDir = 0;
        wasMultiTouch = false;
        pinchPrevDist = 0;
      });

      // Мышь и клавиатура (на ПК)
      let mousePanning = false, mousePrevX = 0, mousePrevY = 0;
      elWorkspace.addEventListener('wheel', (e) => {
        if (displayMode === 'CHAPTERS') return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
        const newZoom = Math.max(getMinZoomForMode(), Math.min(getMaxZoomForMode(), canvasZoom * factor));
        const rect = elWorkspace.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const wx = (mx - canvasPanX) / canvasZoom;
        const wy = (my - canvasPanY) / canvasZoom;
        canvasZoom = newZoom;
        canvasPanX = mx - wx * canvasZoom;
        canvasPanY = my - wy * canvasZoom;
        applyCamera();
      }, { passive: false });

      elWorkspace.addEventListener('mousedown', (e) => {
        if (isInteractiveTarget(e.target)) return;
        if (displayMode === 'TICKER' && e.button === 0) {
          const rect = elWorkspace.getBoundingClientRect();
          manualTickerDir = getTickerDirForSide((e.clientX - rect.left) >= rect.width * 0.5);
          return;
        }
        mousePanning = true;
        mousePrevX = e.clientX;
        mousePrevY = e.clientY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!mousePanning) return;
        canvasPanX += e.clientX - mousePrevX;
        canvasPanY += e.clientY - mousePrevY;
        mousePrevX = e.clientX;
        mousePrevY = e.clientY;
        applyCamera();
      });
      window.addEventListener('mouseup', () => {
        mousePanning = false;
        manualTickerDir = 0;
      });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          if (displayMode === 'WORDS' || displayMode === 'TICKER') {
            e.preventDefault();
            toggleActiveAutoRunning();
          }
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          if (displayMode === 'TICKER') keyTickerDir = getTickerDirForSide(true);
          else stepForward();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          if (displayMode === 'TICKER') keyTickerDir = getTickerDirForSide(false);
          else stepBackward();
        } else if (e.code === 'KeyR' && !e.ctrlKey && displayMode !== 'CHAPTERS') {
          e.preventDefault();
          centerCamera(true);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') keyTickerDir = 0;
      });

      // --- ГЛАВНЫЙ ЦИКЛ АНИМАЦИИ ---
      function mainAnimLoop(now) {
        if (displayMode === 'WORDS' && wordsAutoRunning) {
          if (!wordsLastTime) wordsLastTime = now;
          const dt = Math.min(0.1, (now - wordsLastTime) / 1000);
          wordsLastTime = now;
          wordsAccum += dt;
          const interval = 60.0 / Math.max(10, wordsWpm);
          if (wordsAccum >= interval) {
            wordsAccum -= interval;
            if (!stepForward()) {
              wordsAutoRunning = false;
              updateSovietGaugeUI();
              updateStatusBar();
            }
          }
        } else {
          wordsLastTime = now;
        }

        if (displayMode === 'TICKER') {
          if (!tickerLastTime) tickerLastTime = now;
          const dt = Math.min(0.05, (now - tickerLastTime) / 1000);
          tickerLastTime = now;

          const dir = manualTickerDir !== 0 ? manualTickerDir : (keyTickerDir !== 0 ? keyTickerDir : (tickerAutoRunning ? 1 : 0));
          if (dir !== 0 && tickerItems.length) {
            const pxPerSec = (tickerWpm / 60.0) * tickerAvgWordPx;
            tickerScrollX -= dir * pxPerSec * dt;

            const first = tickerItems[0];
            const last = tickerItems[tickerItems.length - 1];
            const atStart = !getPrevWordPos(first.b, first.c, first.v, first.wIdx);
            const atEnd = !getNextWordPos(last.b, last.c, last.v, last.wIdx);

            const maxStartX = -(tickerStartGateW + first.width * 0.5);
            const minEndX = -(tickerStartGateW + tickerTotalWidth - last.width * 0.5);

            if (atStart && tickerScrollX > maxStartX) tickerScrollX = maxStartX;
            if (atEnd && tickerScrollX < minEndX) {
              tickerScrollX = minEndX;
              if (tickerAutoRunning) {
                tickerAutoRunning = false;
                updateSovietGaugeUI();
                updateStatusBar();
              }
            }

            fillTickerBuffers();
            elTickerTape.style.transform = 'translate3d(' + tickerScrollX + 'px, -50%, 0)';
            syncCurrentFromTickerCenter();
          }
        } else {
          tickerLastTime = now;
        }

        requestAnimationFrame(mainAnimLoop);
      }
      requestAnimationFrame(mainAnimLoop);

      // --- СОБЫТИЯ ИНТЕРФЕЙСА ---
      elBookSel.addEventListener('change', () => {
        currentBook = Number(elBookSel.value);
        if (planActive) {
          const line = getActivePlanLineObj();
          const firstInBook = line ? line.verses.find((x) => x.b === currentBook) : null;
          if (firstInBook) {
            currentChapter = firstInBook.c;
            currentVerse = firstInBook.v;
          }
        } else {
          currentChapter = 1;
          currentVerse = 1;
        }
        currentBlockIdx = 0;
        currentWordIdx = 0;
        populateChapterSelector();
        refreshView();
      });

      elChapSel.addEventListener('change', () => {
        currentChapter = Number(elChapSel.value);
        const vList = getAllowedVerses(currentBook, currentChapter);
        currentVerse = vList.length ? vList[0] : 1;
        currentBlockIdx = 0;
        currentWordIdx = 0;
        recalculateChapterTotals();
        populateVerseSelector();
        refreshView();
      });

      elVerseSel.addEventListener('change', () => {
        currentVerse = Number(elVerseSel.value);
        currentBlockIdx = 0;
        currentWordIdx = 0;
        rebuildCurrentVerseUnits();
        refreshView();
      });

      elModeSel.addEventListener('change', () => {
        displayMode = elModeSel.value;
        wordsAutoRunning = false;
        tickerAutoRunning = false;
        manualTickerDir = 0;
        keyTickerDir = 0;
        closeIosSpeedPicker();
        canvasZoom = Math.max(getMinZoomForMode(), Math.min(getMaxZoomForMode(), canvasZoom));
        refreshView();
        if (displayMode !== 'CHAPTERS') centerCamera(false);
      });

      elPlanBtn.addEventListener('click', openPlanModal);
      elPlanCloseBtn.addEventListener('click', closePlanModal);
      elPlanExitBtn.addEventListener('click', deactivatePlanMode);
      elPlanModalBackdrop.addEventListener('click', (e) => {
        if (e.target === elPlanModalBackdrop) closePlanModal();
      });

      elPlanTab35.addEventListener('click', () => { planModalTab = '35'; renderPlanDaysList(); });
      elPlanTab20.addEventListener('click', () => { planModalTab = '20'; renderPlanDaysList(); });
      elPlanTab365s.addEventListener('click', () => { planModalTab = '365s'; renderPlanDaysList(); });
      elPlanTab365c.addEventListener('click', () => { planModalTab = '365c'; renderPlanDaysList(); });

      elPlanJumpGo.addEventListener('click', () => {
        const val = parseInt(elPlanJumpInput.value, 10);
        if (!isNaN(val) && val >= 1 && val <= 365) {
          activatePlanDay(planModalTab, val);
        }
      });
      elPlanJumpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') elPlanJumpGo.click();
      });

      elCenterBtn.addEventListener('click', () => centerCamera(true));

      function setTopBarCollapsed(collapsed) {
        elTopBar.classList.toggle('collapsed', collapsed);
        elCollapseBtn.textContent = collapsed ? '▼' : '▲';
        syncViewportLayout();
        if (displayMode !== 'CHAPTERS') centerCamera(false);
      }

      elCollapseBtn.addEventListener('click', () => {
        setTopBarCollapsed(!elTopBar.classList.contains('collapsed'));
      });

      elRestoreBarBtn.addEventListener('click', () => {
        setTopBarCollapsed(false);
      });

      function handleResizeOrRotate() {
        syncViewportLayout();
        if (displayMode !== 'CHAPTERS') {
          if (displayMode !== 'TICKER') refreshView();
          centerCamera(false);
        }
      }

      window.addEventListener('resize', handleResizeOrRotate);
      window.addEventListener('orientationchange', () => setTimeout(handleResizeOrRotate, 150));

      // --- ЗАГРУЗКА БАЗЫ ---
      async function init() {
        syncViewportLayout();
        buildIosSpeedRuler();
        updatePlanButtonUI();
        try {
          elLoaderText.textContent = 'Загрузка базы Писания RST+...';
          const resp = await fetch('./bible.json');
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          elLoaderText.textContent = 'Индексация 66 книг...';
          const data = await resp.json();
          booksOrder = (data.order || []).map(Number).sort((a, z) => a - z);
          booksNames = data.books || {};
          bibleData = data.verses || {};
          buildNavigationIndex();
          buildYearlyPlans();
          populateBookSelector();
          elModeSel.value = displayMode;
          updateSovietGaugeUI();
          elLoader.style.display = 'none';
          refreshView();
          centerCamera(true);
        } catch (err) {
          showFatalError('Не удалось загрузить bible.json: ' + (err.message || err));
        }
      }

      init();
    })();
  </script>
</body>
</html>
