<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Библия RST+">
  <meta name="theme-color" content="#1A1D22">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Библия RST+ Скорочтение</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1A1D22;
      --card: #181B20;
      --border: #2A2F37;
      --text: #E6E1DA;
      --muted: #7C8594;
      --accent: #D4A359;
      --ios-amber: #F59E4B;
      --verse-bar: #5FA8D3;
      --word-active: #F7E8C8;
      --word-read: #4B5260;
      --word-next: #757F91;
      --verse-tag: #7A623A;
      --green: #2E8B57;
      --green-hover: #38A869;
      --red: #B83B44;
      --red-hover: #D14953;
      --neon-green: #22E584;
      --neon-red: #FF3B5C;
      --app-h: 100vh;
      --top-extra: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-h);
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--app-h);
      display: flex;
      flex-direction: column;
      width: 100%;
      background: var(--bg);
    }

    /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
    #top-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding-top: calc(env(safe-area-inset-top, 0px) + var(--top-extra));
      padding-left: calc(env(safe-area-inset-left, 0px) + 10px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 10px);
      padding-bottom: 8px;
      z-index: 30;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    #top-bar.collapsed .row-secondary {
      display: none;
    }

    select, button {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #22262E;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 34px;
      padding: 0 8px;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    select:active, button:active {
      transform: scale(0.97);
    }

    #book-select { flex: 1 1 auto; min-width: 96px; }
    #chapter-select,
    #verse-select {
      width: 82px;
      flex-shrink: 0;
      padding: 0 4px 0 6px;
      font-size: 13px;
    }
    #mode-select { flex: 1 1 auto; min-width: 135px; }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .toggle-btn.active {
      background: rgba(34, 229, 132, 0.14);
      border-color: var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 10px rgba(34, 229, 132, 0.22);
    }

    #collapse-btn {
      width: 34px;
      padding: 0;
      flex-shrink: 0;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #restore-bar-btn {
      position: absolute;
      top: 8px;
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      width: 34px;
      height: 30px;
      border-radius: 8px;
      background: rgba(26, 29, 34, 0.85);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      cursor: pointer;
    }

    /* --- РАБОЧАЯ ОБЛАСТЬ 1: ХОЛСТ --- */
    #workspace {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #workspace:active {
      cursor: grabbing;
    }

    #canvas-root {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }

    .tap-flash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease-out;
      z-index: 5;
    }
    #flash-left {
      left: 0;
      background: radial-gradient(circle at 0% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    #flash-right {
      right: 0;
      background: radial-gradient(circle at 100% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    .tap-flash.show {
      opacity: 1;
      transition: opacity 0.04s ease-in;
    }

    /* --- КАРТОЧКА (ДЛЯ БЛОКОВ И СТИХОВ) --- */
    #card-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
    }

    #block-progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prog-label {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      width: 100%;
      height: 7px;
      background: #1F242C;
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.16s ease-out;
    }

    .prog-fill.verse-fill {
      background: var(--verse-bar);
    }

    #text-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    #text-card.bound-start {
      border-color: rgba(34, 229, 132, 0.72);
      box-shadow:
        inset 4px 0 0 var(--neon-green),
        0 0 22px rgba(34, 229, 132, 0.22),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }

    #text-card.bound-end {
      border-color: rgba(255, 59, 92, 0.75);
      box-shadow:
        inset -4px 0 0 var(--neon-red),
        0 0 24px rgba(255, 59, 92, 0.24),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .card-bound-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .card-bound-pill.start {
      color: var(--neon-green);
      background: rgba(34, 229, 132, 0.12);
      border: 1px solid rgba(34, 229, 132, 0.5);
      box-shadow: 0 0 12px rgba(34, 229, 132, 0.28);
    }

    .card-bound-pill.end {
      color: var(--neon-red);
      background: rgba(255, 59, 92, 0.12);
      border: 1px solid rgba(255, 59, 92, 0.55);
      box-shadow: 0 0 12px rgba(255, 59, 92, 0.28);
    }

    .bound-pill-wrap { text-align: center; }

    .block-ref {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .block-main {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
      margin-bottom: 16px;
      animation: popIn 0.12s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0.55; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .block-dots {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .dot-active { color: var(--accent); }
    .dot-done { color: #4C566A; }
    .dot-todo { color: #2E3440; }

    .block-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0 14px;
    }

    .block-context {
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .ctx-active { color: var(--accent); font-weight: 600; }
    .ctx-done { color: #616A78; }
    .ctx-todo { color: #949DAB; }

    .block-adj {
      margin-top: 14px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.45;
      color: #4B5260;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .verse-ref {
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .verse-body {
      font-size: 21px;
      line-height: 1.55;
      color: var(--text);
    }

    /* --- НЕОНОВЫЕ ПОЛОСЫ-ГРАНИЦЫ В ЛЕНТАХ --- */
    .neon-gate {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin: 0 22px;
      flex-shrink: 0;
    }

    .neon-gate-line {
      width: 4px;
      height: 76px;
      border-radius: 4px;
    }

    .neon-gate-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .neon-gate.start .neon-gate-line {
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green), 0 0 20px rgba(34, 229, 132, 0.75);
    }

    .neon-gate.start .neon-gate-tag {
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(34, 229, 132, 0.7);
    }

    .neon-gate.end .neon-gate-line {
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red), 0 0 20px rgba(255, 59, 92, 0.78);
    }

    .neon-gate.end .neon-gate-tag {
      color: var(--neon-red);
      text-shadow: 0 0 8px rgba(255, 59, 92, 0.7);
    }

    /* --- РЕЖИМ "ПО СЛОВАМ" --- */
    #word-stream-root {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    #word-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
    }

    .stream-word {
      display: inline-block;
      margin: 0 9px;
      font-size: 22px;
      line-height: 1;
      transition: color 0.1s ease;
    }

    .stream-word.read { color: var(--word-read); }
    .stream-word.next { color: var(--word-next); }
    .stream-word.active {
      font-size: 46px;
      font-weight: 700;
      color: var(--word-active);
      margin: 0 14px;
      text-shadow: 0 0 18px rgba(212, 163, 89, 0.25);
    }

    .stream-vtag {
      display: inline-block;
      font-size: 11px;
      color: var(--verse-tag);
      vertical-align: super;
      margin-right: -4px;
      margin-left: 6px;
      transform: translateY(-9px);
    }

    /* --- РЕЖИМ "БЕГУЩАЯ СТРОКА" --- */
    #ticker-stream-root {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    #ticker-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      padding-right: 16px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .ticker-vtag {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.72;
      margin-right: 7px;
      transform: translateY(-10px);
    }

    /* --- ФИКСИРОВАННЫЙ HUD ПРОГРЕССА --- */
    #word-hud {
      position: absolute;
      top: 10px;
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      background: rgba(20, 23, 28, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(46, 53, 64, 0.88);
      border-radius: 10px;
      padding: 9px 12px;
      z-index: 15;
      display: none;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .hud-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #hud-ref {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    #hud-ch-lbl {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #hud-v-lbl {
      font-size: 12px;
      color: var(--verse-bar);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* --- ОВЕРЛЕИ АВТОПРОИГРЫВАНИЯ ("ПО СЛОВАМ") --- */
    #autoplay-play-btn {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + 18px);
      bottom: 18px;
      width: 54px;
      height: 54px;
      padding: 0;
      border-radius: 50%;
      background: var(--green);
      border: none;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(46, 139, 87, 0.4);
      z-index: 20;
      cursor: pointer;
    }

    #autoplay-play-btn svg { width: 24px; height: 24px; display: block; }
    #autoplay-play-btn:active { background: var(--green-hover); transform: scale(0.94); }

    #autoplay-popup {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + 16px);
      bottom: 84px;
      width: min(300px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid #3A414D;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .pop-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .pop-speed-row { display: flex; align-items: center; gap: 8px; }
    .pop-speed-row label { font-size: 13px; color: var(--muted); }

    #wpm-input {
      flex: 1;
      height: 36px;
      background: #121417;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .pop-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pop-presets button { height: 32px; font-size: 13px; }

    #autoplay-confirm-btn {
      background: var(--green);
      border: none;
      color: #fff;
      font-weight: 600;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
    }

    #autoplay-controls {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: min(340px, calc(100vw - 32px));
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    #autoplay-status {
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      background: rgba(18, 20, 23, 0.78);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .auto-btn-row { display: flex; width: 100%; gap: 8px; }

    #autoplay-toggle-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #autoplay-toggle-btn svg { width: 16px; height: 16px; display: block; }
    #autoplay-toggle-btn.running { background: #B88635; }

    #autoplay-exit-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

    /* --- СОВЕТСКИЙ ПРИБОР СКОРОСТИ ("БЕГУЩАЯ СТРОКА") --- */
    #ticker-dock {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 12px;
      background: linear-gradient(180deg, #16191E 0%, #111317 100%);
      border-top: 1px solid #2A2F37;
      z-index: 28;
      flex-shrink: 0;
    }

    #ticker-invert-btn {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid #353B46;
      background: linear-gradient(180deg, #242932 0%, #171B21 100%);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      flex-shrink: 0;
    }

    #ticker-invert-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    #ticker-invert-btn.active {
      border-color: var(--ios-amber);
      background: rgba(245, 158, 75, 0.16);
      color: var(--ios-amber);
      box-shadow: 0 0 14px rgba(245, 158, 75, 0.3);
    }

    #soviet-gauge-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 66px;
      padding: 6px 12px 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #242830 0%, #171A1F 100%);
      border: 2px solid #393F4A;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.05), inset 0 -3px 8px rgba(0, 0, 0, 0.65), 0 4px 12px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    #soviet-gauge-btn:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .gauge-screw {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #666E7A, #262A30);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
    }
    .gauge-screw.tl { top: 4px; left: 4px; }
    .gauge-screw.tr { top: 4px; right: 4px; }
    .gauge-screw.bl { bottom: 4px; left: 4px; }
    .gauge-screw.br { bottom: 4px; right: 4px; }

    .gauge-dial-window {
      width: 88px;
      height: 50px;
      background: radial-gradient(ellipse at 50% 95%, #231D15 0%, #11100E 85%);
      border: 1.5px solid #0B0C0E;
      border-radius: 8px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .gauge-dial-window svg {
      width: 86px;
      height: 48px;
      display: block;
    }

    #gauge-needle-group {
      transform-origin: 50px 46px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gauge-readout {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 70px;
    }

    .gauge-caption {
      font-size: 9px;
      letter-spacing: 1.2px;
      color: #88919F;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .gauge-value-box {
      background: #0B0D10;
      border: 1px solid #2C313A;
      border-radius: 5px;
      padding: 2px 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--ios-amber);
      text-shadow: 0 0 8px rgba(245, 158, 75, 0.35);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 10px;
      color: #7C8594;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    #ticker-play-btn {
      width: 54px;
      height: 54px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #3A4D40;
      background: linear-gradient(180deg, #32945E 0%, #236E45 100%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      flex-shrink: 0;
    }

    #ticker-play-btn svg { width: 24px; height: 24px; display: block; }
    #ticker-play-btn.running {
      border-color: #6B532C;
      background: linear-gradient(180deg, #C78D38 0%, #966622 100%);
    }

    /* --- МОДАЛЬНОЕ ОКНО ВЫБОРА ГРАФИКА И ДНЯ --- */
    #plan-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
    }

    #plan-modal-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.16s ease-out;
    }

    #plan-modal {
      width: min(460px, 100%);
      max-height: 100%;
      background: #14171C;
      border: 1px solid #2E3440;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
    }

    .plan-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      background: var(--panel);
      gap: 10px;
    }

    .plan-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .plan-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #plan-exit-btn {
      display: none;
      height: 30px;
      padding: 0 10px;
      background: rgba(184, 59, 68, 0.22);
      border-color: rgba(255, 59, 92, 0.5);
      color: #FF6B84;
      font-size: 12.5px;
      font-weight: 600;
    }

    #plan-close-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
    }

    .plan-tabs-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 16px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .plan-tab-btn {
      height: 34px;
      border-radius: 9px;
      background: #12151A;
      border: 1px solid #2A303B;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .plan-tab-btn.active {
      background: rgba(212, 163, 89, 0.16);
      border-color: var(--accent);
      color: var(--accent);
    }

    #plan-days-list {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .plan-day-card {
      width: 100%;
      height: auto;
      padding: 10px 12px;
      background: #1A1E25;
      border: 1px solid #282E38;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .plan-day-card.active {
      border-color: var(--neon-green);
      background: rgba(34, 229, 132, 0.08);
      box-shadow: 0 0 14px rgba(34, 229, 132, 0.16);
    }

    .plan-day-num {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #12151A;
      border: 1px solid #2C333F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .plan-day-card.active .plan-day-num {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .plan-day-num span:first-child { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }
    .plan-day-num span:last-child { font-size: 17px; font-weight: 700; line-height: 1.1; }

    .plan-day-info {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .plan-line-row {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plan-line-row.wisdom { font-size: 12px; color: var(--accent); }
    .plan-line-row.sub { font-size: 11.5px; color: var(--muted); }
    .plan-line-badge {
      display: inline-block;
      font-size: 10px;
      color: var(--muted);
      margin-right: 5px;
      text-transform: uppercase;
    }

    /* --- ВЫДВИЖНОЙ ВЫБОР СКОРОСТИ В СТИЛЕ ТАЙМЕРА iOS --- */
    #ios-speed-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
    }

    #ios-speed-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.16s ease-out;
    }

    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #ios-speed-sheet {
      width: min(410px, 100%);
      background: #090A0C;
      border: 1px solid #23272F;
      border-radius: 26px;
      padding: 18px 18px 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideUpSheet 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUpSheet {
      from { transform: translateY(28px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    #ios-ruler-viewport {
      position: relative;
      width: 100%;
      height: 78px;
      overflow: hidden;
      touch-action: none;
      cursor: ew-resize;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
    }

    #ios-ruler-track {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      will-change: transform;
    }

    .ios-tick {
      position: relative;
      width: 14px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    .ios-tick-num {
      position: absolute;
      top: 4px;
      font-size: 15px;
      font-weight: 600;
      color: rgba(245, 158, 75, 0.72);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }

    .ios-tick-bar {
      width: 3px;
      height: 34px;
      border-radius: 2px;
      background: rgba(245, 158, 75, 0.45);
      transition: background 0.08s ease, height 0.08s ease;
    }

    .ios-tick.major .ios-tick-bar { height: 42px; background: rgba(245, 158, 75, 0.78); }
    .ios-tick.selected .ios-tick-bar {
      background: #FFB266;
      height: 44px;
      box-shadow: 0 0 10px rgba(245, 158, 75, 0.7);
    }
    .ios-tick.selected .ios-tick-num { color: #FFB266; }

    .ios-pointer-row { display: flex; justify-content: center; margin-top: -2px; margin-bottom: 6px; }
    .ios-triangle {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 10px solid var(--ios-amber);
      filter: drop-shadow(0 0 6px rgba(245, 158, 75, 0.5));
    }

    .ios-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 2px;
    }

    #ios-confirm-btn {
      height: 44px;
      padding: 0 22px;
      border-radius: 999px;
      border: none;
      background: rgba(245, 158, 75, 0.18);
      color: var(--ios-amber);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #ios-confirm-btn:active { background: rgba(245, 158, 75, 0.32); }

    .ios-big-readout {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--ios-amber);
      font-variant-numeric: tabular-nums;
    }

    #ios-big-wpm { font-size: 38px; font-weight: 400; line-height: 1; letter-spacing: -0.5px; }
    .ios-big-unit { font-size: 15px; opacity: 0.75; }

    /* --- РАБОЧАЯ ОБЛАСТЬ 2: ОБЫЧНЫЙ СКРОЛЛ ("ПО ГЛАВАМ") --- */
    #chapter-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: none;
      padding: 18px calc(env(safe-area-inset-right, 0px) + 14px) 48px calc(env(safe-area-inset-left, 0px) + 14px);
    }

    #chapter-container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px 28px;
      user-select: text;
      -webkit-user-select: text;
    }

    .ch-title { color: var(--accent); font-size: 23px; font-weight: 700; margin-bottom: 18px; }
    .ch-verse { font-size: 19px; line-height: 1.65; margin-bottom: 12px; color: var(--text); }
    .ch-vnum { color: var(--muted); font-size: 14px; font-weight: 700; margin-right: 6px; }
    .ch-dot { color: #4C566A; margin: 0 5px; }

    .ch-neon-banner { height: 3px; border-radius: 3px; margin: 14px 0; }
    .ch-neon-banner.start { background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }
    .ch-neon-banner.end { background: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

    .ch-nav-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .ch-nav-row button { flex: 1; height: 40px; font-size: 14px; font-weight: 500; }

    /* --- НИЖНЯЯ СТРОКА СОСТОЯНИЯ --- */
    #status-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 7px 14px calc(env(safe-area-inset-bottom, 0px) + 6px);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      z-index: 30;
    }

    /* =====================================================================
       КОМПАКТНЫЙ АЛЬБОМНЫЙ РЕЖИМ
       ===================================================================== */
    body.landscape-compact #top-bar {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
      padding-bottom: 6px;
      padding-left: calc(env(safe-area-inset-left, 0px) + 12px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 12px);
    }

    body.landscape-compact #top-bar.collapsed { display: none; }
    body.landscape-compact.bar-hidden #restore-bar-btn { display: flex; }

    body.landscape-compact .top-row { gap: 5px; }
    body.landscape-compact .row-primary { flex: 1 1 auto; }
    body.landscape-compact .row-secondary { flex: 0 1 auto; }

    body.landscape-compact #top-bar select,
    body.landscape-compact #top-bar button {
      height: 30px;
      font-size: 13px;
      border-radius: 7px;
      padding: 0 7px;
    }

    body.landscape-compact #book-select { min-width: 90px; max-width: 170px; }
    body.landscape-compact #chapter-select,
    body.landscape-compact #verse-select { width: 72px; padding: 0 3px 0 5px; }
    body.landscape-compact #mode-select { min-width: 130px; max-width: 170px; }
    body.landscape-compact #collapse-btn { width: 30px; padding: 0; }

    body.landscape-compact #word-hud {
      top: 6px;
      padding: 5px 12px;
      border-radius: 8px;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    body.landscape-compact #word-hud .hud-section { flex: 1 1 0; gap: 3px; }
    body.landscape-compact #hud-ref { font-size: 12px; }
    body.landscape-compact #hud-ch-lbl,
    body.landscape-compact #hud-v-lbl { font-size: 11px; }
    body.landscape-compact #word-hud .prog-track { height: 4px !important; }

    body.landscape-compact #ticker-dock {
      padding: 5px 12px calc(env(safe-area-inset-bottom, 0px) + 5px);
      gap: 10px;
    }

    body.landscape-compact #ticker-invert-btn { width: 38px; height: 38px; }
    body.landscape-compact #ticker-invert-btn svg { width: 18px; height: 18px; }

    body.landscape-compact #soviet-gauge-btn {
      height: 44px;
      padding: 3px 10px 3px 8px;
      gap: 8px;
      border-radius: 9px;
      border-width: 1.5px;
    }

    body.landscape-compact .gauge-screw { width: 4px; height: 4px; }
    body.landscape-compact .gauge-dial-window { width: 64px; height: 34px; border-radius: 6px; }
    body.landscape-compact .gauge-dial-window svg { width: 62px; height: 32px; }
    body.landscape-compact .gauge-readout { flex-direction: row; align-items: baseline; gap: 5px; min-width: 0; }
    body.landscape-compact .gauge-caption { display: none; }
    body.landscape-compact .gauge-value-box { font-size: 16px; padding: 1px 6px; }
    body.landscape-compact .gauge-unit { font-size: 10px; margin-top: 0; }

    body.landscape-compact #ticker-play-btn { width: 40px; height: 40px; }
    body.landscape-compact #ticker-play-btn svg { width: 18px; height: 18px; }

    body.landscape-compact #status-bar { display: none; }

    body.landscape-compact #text-card { padding: 14px 18px; }
    body.landscape-compact .block-ref { margin-bottom: 8px; }
    body.landscape-compact .block-main { font-size: 22px; margin-bottom: 10px; }
    body.landscape-compact .block-dots { margin-bottom: 6px; }
    body.landscape-compact .block-divider { margin: 8px 0; }
    body.landscape-compact .block-adj { display: none; }

    body.landscape-compact #ios-speed-sheet {
      padding: 12px 16px 12px;
      border-radius: 20px;
      gap: 4px;
    }
    body.landscape-compact #ios-ruler-viewport { height: 64px; }
    body.landscape-compact #ios-big-wpm { font-size: 32px; }
    body.landscape-compact #ios-confirm-btn { height: 38px; font-size: 15px; }

    /* --- ЭКРАН ЗАГРУЗКИ --- */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      color: var(--text);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">Загрузка Писания RST+...</div>
  </div>

  <div id="app">
    <header id="top-bar">
      <div class="top-row row-primary">
        <select id="book-select" aria-label="Книга"></select>
        <select id="chapter-select" aria-label="Глава"></select>
        <select id="verse-select" aria-label="Стих"></select>
        <button id="collapse-btn" title="Свернуть/развернуть панель">▲</button>
      </div>
      <div class="top-row row-secondary">
        <select id="mode-select" aria-label="Режим">
          <option value="BLOCKS">Смысловыми блоками</option>
          <option value="WORDS">По словам</option>
          <option value="TICKER">Бегущая строка</option>
          <option value="VERSES">По стихам</option>
          <option value="CHAPTERS">По главам</option>
        </select>
        <button id="plan-btn" class="toggle-btn">График</button>
        <button id="center-btn" class="toggle-btn">Центр</button>
      </div>
    </header>

    <main id="workspace">
      <button id="restore-bar-btn" type="button" title="Показать панель">▼</button>
      <div id="flash-left" class="tap-flash"></div>
      <div id="flash-right" class="tap-flash"></div>

      <!-- Фиксированный HUD прогресса -->
      <div id="word-hud">
        <div class="hud-section">
          <div class="hud-row">
            <span id="hud-ref">Бытие 1:1</span>
            <span id="hud-ch-lbl">Гл. 1 — 0%</span>
          </div>
          <div class="prog-track"><div id="hud-ch-fill" class="prog-fill"></div></div>
        </div>
        <div class="hud-section">
          <div class="hud-row">
            <span id="hud-v-lbl">Ст. 1 — 0%</span>
          </div>
          <div class="prog-track" style="height:5px;"><div id="hud-v-fill" class="prog-fill verse-fill"></div></div>
        </div>
      </div>

      <!-- Масштабируемый и перемещаемый двумя пальцами холст -->
      <div id="canvas-root">
        <div id="card-stack">
          <div id="block-progress-box">
            <div id="block-prog-lbl" class="prog-label">Глава 1 — 0%</div>
            <div class="prog-track"><div id="block-prog-fill" class="prog-fill"></div></div>
          </div>
          <div id="text-card"></div>
        </div>

        <div id="word-stream-root">
          <div id="word-tape"></div>
        </div>

        <div id="ticker-stream-root">
          <div id="ticker-tape"></div>
        </div>
      </div>

      <!-- Автопроигрывание ("По словам") -->
      <button id="autoplay-play-btn" aria-label="Автопроигрывание">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      </button>

      <div id="autoplay-popup">
        <div class="pop-title">Автопроигрывание слов</div>
        <div class="pop-speed-row">
          <label for="wpm-input">Слов/мин:</label>
          <input id="wpm-input" type="number" min="40" max="1200" step="10" value="250">
        </div>
        <div class="pop-presets">
          <button type="button" data-wpm="150">150</button>
          <button type="button" data-wpm="250">250</button>
          <button type="button" data-wpm="350">350</button>
          <button type="button" data-wpm="500">500</button>
        </div>
        <button id="autoplay-confirm-btn" type="button">Подтвердить</button>
      </div>

      <div id="autoplay-controls">
        <div id="autoplay-status">Пауза (250 сл/мин)</div>
        <div class="auto-btn-row">
          <button id="autoplay-toggle-btn" type="button"></button>
          <button id="autoplay-exit-btn" type="button">Выйти</button>
        </div>
      </div>
    </main>

    <!-- Советский прибор скорости ("Бегущая строка") -->
    <div id="ticker-dock">
      <button id="ticker-invert-btn" type="button" title="Инверсия управления (лево/право)" aria-label="Инверсия управления">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3l4 4-4 4"/>
          <path d="M3 7h18"/>
          <path d="M7 21l-4-4 4-4"/>
          <path d="M21 17H3"/>
        </svg>
      </button>

      <div id="soviet-gauge-btn" role="button" aria-label="Настроить скорость">
        <span class="gauge-screw tl"></span>
        <span class="gauge-screw tr"></span>
        <span class="gauge-screw bl"></span>
        <span class="gauge-screw br"></span>

        <div class="gauge-dial-window">
          <svg viewBox="0 0 100 54">
            <path d="M 10 46 A 40 40 0 0 1 90 46" fill="none" stroke="#5A5042" stroke-width="2"/>
            <path d="M 78 18 A 40 40 0 0 1 90 46" fill="none" stroke="#B83B44" stroke-width="2.5"/>
            <g stroke="#C9B08A" stroke-width="1.2">
              <line x1="10" y1="46" x2="17" y2="46"/>
              <line x1="15" y1="26" x2="21" y2="29"/>
              <line x1="30" y1="11" x2="33" y2="17"/>
              <line x1="50" y1="6" x2="50" y2="13"/>
              <line x1="70" y1="11" x2="67" y2="17"/>
              <line x1="85" y1="26" x2="79" y2="29" stroke="#D14953"/>
              <line x1="90" y1="46" x2="83" y2="46" stroke="#D14953"/>
            </g>
            <text x="50" y="34" text-anchor="middle" fill="#6F6556" font-size="6.5" font-family="monospace">ТХ-800</text>
            <g id="gauge-needle-group">
              <line x1="50" y1="46" x2="50" y2="11" stroke="#F59E4B" stroke-width="2" stroke-linecap="round"/>
            </g>
            <circle cx="50" cy="46" r="4.5" fill="#464D58" stroke="#181B20" stroke-width="1"/>
          </svg>
        </div>

        <div class="gauge-readout">
          <span class="gauge-caption">СКОРОСТЬ</span>
          <span id="gauge-wpm-val" class="gauge-value-box">220</span>
          <span class="gauge-unit">СЛ/МИН</span>
        </div>
      </div>

      <button id="ticker-play-btn" type="button" aria-label="Старт/Пауза бегущей строки"></button>
    </div>

    <!-- Режим "По главам" -->
    <section id="chapter-scroll">
      <div id="chapter-container"></div>
    </section>
