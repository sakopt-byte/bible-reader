<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Библия RST+">
  <meta name="theme-color" content="#1A1D22">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Библия RST+ Скорочтение</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1A1D22;
      --card: #181B20;
      --border: #2A2F37;
      --text: #E6E1DA;
      --muted: #7C8594;
      --accent: #D4A359;
      --ios-amber: #F59E4B;
      --verse-bar: #5FA8D3;
      --word-active: #F7E8C8;
      --word-read: #4B5260;
      --word-next: #757F91;
      --verse-tag: #7A623A;
      --green: #2E8B57;
      --green-hover: #38A869;
      --red: #B83B44;
      --red-hover: #D14953;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
    #top-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
      padding-left: calc(env(safe-area-inset-left, 0px) + 10px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 10px);
      padding-bottom: 8px;
      z-index: 30;
      flex-shrink: 0;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .top-row + .top-row {
      margin-top: 6px;
    }

    #top-bar.collapsed .row-secondary {
      display: none;
    }

    select, button {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #22262E;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 34px;
      padding: 0 8px;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    select:active, button:active {
      transform: scale(0.97);
    }

    #book-select { flex: 1 1 auto; min-width: 110px; }
    #chapter-select { width: 64px; flex-shrink: 0; }
    #verse-select { width: 64px; flex-shrink: 0; }
    #mode-select { flex: 1 1 auto; min-width: 140px; }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .toggle-btn.active {
      background: rgba(212, 163, 89, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }

    #collapse-btn {
      width: 34px;
      padding: 0;
      flex-shrink: 0;
      color: var(--muted);
    }

    /* --- РАБОЧАЯ ОБЛАСТЬ 1: ХОЛСТ --- */
    #workspace {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #workspace:active {
      cursor: grabbing;
    }

    #canvas-root {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }

    /* Визуальная подсказка тапа слева / справа (НЕ используется в "Бегущей строке") */
    .tap-flash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease-out;
      z-index: 5;
    }
    #flash-left {
      left: 0;
      background: radial-gradient(circle at 0% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    #flash-right {
      right: 0;
      background: radial-gradient(circle at 100% 50%, rgba(212, 163, 89, 0.14), transparent 72%);
    }
    .tap-flash.show {
      opacity: 1;
      transition: opacity 0.04s ease-in;
    }

    /* --- КАРТОЧКА (ДЛЯ БЛОКОВ И СТИХОВ) --- */
    #card-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
    }

    #block-progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prog-label {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      width: 100%;
      height: 7px;
      background: #1F242C;
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.16s ease-out;
    }

    .prog-fill.verse-fill {
      background: var(--verse-bar);
    }

    #text-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .block-ref {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .block-main {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
      margin-bottom: 16px;
      animation: popIn 0.12s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0.55; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .block-dots {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .dot-active { color: var(--accent); }
    .dot-done { color: #4C566A; }
    .dot-todo { color: #2E3440; }

    .block-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0 14px;
    }

    .block-context {
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .ctx-active { color: var(--accent); font-weight: 600; }
    .ctx-done { color: #616A78; }
    .ctx-todo { color: #949DAB; }

    .block-adj {
      margin-top: 14px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.45;
      color: #4B5260;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .verse-ref {
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .verse-body {
      font-size: 21px;
      line-height: 1.55;
      color: var(--text);
    }

    .strong {
      color: #6E7785;
      font-size: 0.68em;
      font-weight: 400;
      margin-left: 2px;
    }

    /* --- РЕЖИМ "ПО СЛОВАМ": БЕСКОНЕЧНАЯ СТРОКА --- */
    #word-stream-root {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    #word-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
    }

    .stream-word {
      display: inline-block;
      margin: 0 9px;
      font-size: 22px;
      line-height: 1;
      transition: color 0.1s ease;
    }

    .stream-word.read { color: var(--word-read); }
    .stream-word.next { color: var(--word-next); }
    .stream-word.active {
      font-size: 46px;
      font-weight: 700;
      color: var(--word-active);
      margin: 0 14px;
      text-shadow: 0 0 18px rgba(212, 163, 89, 0.25);
    }

    .stream-vtag {
      display: inline-block;
      font-size: 11px;
      color: var(--verse-tag);
      vertical-align: super;
      margin-right: -4px;
      margin-left: 6px;
      transform: translateY(-9px);
    }

    /* --- РЕЖИМ "БЕГУЩАЯ СТРОКА": ПЛАВНАЯ ТВ-ЛЕНТА --- */
    #ticker-stream-root {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    #ticker-tape {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      will-change: transform;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      padding-right: 16px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .ticker-vtag {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.72;
      margin-right: 7px;
      transform: translateY(-10px);
    }

    /* --- ФИКСИРОВАННЫЙ HUD ПРОГРЕССА (ДЛЯ "ПО СЛОВАМ" И "БЕГУЩЕЙ СТРОКИ") --- */
    #word-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      background: rgba(20, 23, 28, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(46, 53, 64, 0.9);
      border-radius: 10px;
      padding: 10px 14px;
      z-index: 15;
      display: none;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #hud-ref {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    #hud-ch-lbl {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #hud-v-lbl {
      font-size: 12px;
      color: var(--verse-bar);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    /* --- ОВЕРЛЕИ АВТОПРОИГРЫВАНИЯ (ДЛЯ РЕЖИМА "ПО СЛОВАМ") --- */
    #autoplay-play-btn {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--green);
      border: none;
      color: #fff;
      font-size: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(46, 139, 87, 0.4);
      z-index: 20;
      cursor: pointer;
      padding-left: 4px;
    }

    #autoplay-play-btn:active {
      background: var(--green-hover);
      transform: scale(0.94);
    }

    #autoplay-popup {
      position: absolute;
      right: 16px;
      bottom: 88px;
      width: min(300px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid #3A414D;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .pop-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .pop-speed-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pop-speed-row label {
      font-size: 13px;
      color: var(--muted);
    }

    #wpm-input {
      flex: 1;
      height: 36px;
      background: #121417;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .pop-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .pop-presets button {
      height: 32px;
      font-size: 13px;
    }

    #autoplay-confirm-btn {
      background: var(--green);
      border: none;
      color: #fff;
      font-weight: 600;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
    }

    #autoplay-controls {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(340px, calc(100vw - 32px));
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    #autoplay-status {
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      background: rgba(18, 20, 23, 0.78);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .auto-btn-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    #autoplay-toggle-btn {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
    }

    #autoplay-toggle-btn.running {
      background: #B88635;
    }

    #autoplay-exit-btn {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

    /* --- СОВЕТСКИЙ ПРИБОР СКОРОСТИ (ПРИВЯЗАН К ИНТЕРФЕЙСУ СНИЗУ В "БЕГУЩЕЙ СТРОКЕ") --- */
    #ticker-dock {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #16191E 0%, #111317 100%);
      border-top: 1px solid #2A2F37;
      z-index: 28;
      flex-shrink: 0;
    }

    #soviet-gauge-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 68px;
      padding: 6px 14px 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #242830 0%, #171A1F 100%);
      border: 2px solid #393F4A;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.05), inset 0 -3px 8px rgba(0, 0, 0, 0.65), 0 4px 12px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    #soviet-gauge-btn:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .gauge-screw {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #666E7A, #262A30);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
    }
    .gauge-screw.tl { top: 4px; left: 4px; }
    .gauge-screw.tr { top: 4px; right: 4px; }
    .gauge-screw.bl { bottom: 4px; left: 4px; }
    .gauge-screw.br { bottom: 4px; right: 4px; }

    .gauge-dial-window {
      width: 96px;
      height: 52px;
      background: radial-gradient(ellipse at 50% 95%, #231D15 0%, #11100E 85%);
      border: 1.5px solid #0B0C0E;
      border-radius: 8px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .gauge-dial-window svg {
      width: 94px;
      height: 50px;
      display: block;
    }

    #gauge-needle-group {
      transform-origin: 50px 46px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gauge-readout {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 78px;
    }

    .gauge-caption {
      font-size: 9px;
      letter-spacing: 1.2px;
      color: #88919F;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .gauge-value-box {
      background: #0B0D10;
      border: 1px solid #2C313A;
      border-radius: 5px;
      padding: 2px 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--ios-amber);
      text-shadow: 0 0 8px rgba(245, 158, 75, 0.35);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 10px;
      color: #7C8594;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    #ticker-play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #3A4D40;
      background: linear-gradient(180deg, #32945E 0%, #236E45 100%);
      color: #fff;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      flex-shrink: 0;
      padding-left: 3px;
    }

    #ticker-play-btn.running {
      border-color: #6B532C;
      background: linear-gradient(180deg, #C78D38 0%, #966622 100%);
      padding-left: 0;
    }

    /* --- ВЫДВИЖНОЙ ВЫБОР СКОРОСТИ В СТИЛЕ ТАЙМЕРА iOS --- */
    #ios-speed-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 20px);
    }

    #ios-speed-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.16s ease-out;
    }

    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #ios-speed-sheet {
      width: min(410px, 100%);
      background: #090A0C;
      border: 1px solid #23272F;
      border-radius: 26px;
      padding: 20px 18px 18px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideUpSheet 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUpSheet {
      from { transform: translateY(28px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    #ios-ruler-viewport {
      position: relative;
      width: 100%;
      height: 82px;
      overflow: hidden;
      touch-action: none;
      cursor: ew-resize;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
    }

    #ios-ruler-track {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      will-change: transform;
    }

    .ios-tick {
      position: relative;
      width: 14px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    .ios-tick-num {
      position: absolute;
      top: 4px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(245, 158, 75, 0.72);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }

    .ios-tick-bar {
      width: 3px;
      height: 36px;
      border-radius: 2px;
      background: rgba(245, 158, 75, 0.45);
      transition: background 0.08s ease, height 0.08s ease;
    }

    .ios-tick.major .ios-tick-bar {
      height: 44px;
      background: rgba(245, 158, 75, 0.78);
    }

    .ios-tick.selected .ios-tick-bar {
      background: #FFB266;
      height: 46px;
      box-shadow: 0 0 10px rgba(245, 158, 75, 0.7);
    }

    .ios-tick.selected .ios-tick-num {
      color: #FFB266;
    }

    .ios-pointer-row {
      display: flex;
      justify-content: center;
      margin-top: -2px;
      margin-bottom: 8px;
    }

    .ios-triangle {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 10px solid var(--ios-amber);
      filter: drop-shadow(0 0 6px rgba(245, 158, 75, 0.5));
    }

    .ios-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 4px;
    }

    #ios-confirm-btn {
      height: 46px;
      padding: 0 22px;
      border-radius: 999px;
      border: none;
      background: rgba(245, 158, 75, 0.18);
      color: var(--ios-amber);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #ios-confirm-btn:active {
      background: rgba(245, 158, 75, 0.32);
    }

    .ios-big-readout {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--ios-amber);
      font-variant-numeric: tabular-nums;
    }

    #ios-big-wpm {
      font-size: 40px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .ios-big-unit {
      font-size: 15px;
      opacity: 0.75;
    }

    /* --- РАБОЧАЯ ОБЛАСТЬ 2: ОБЫЧНЫЙ СКРОЛЛ ДЛЯ "ПО ГЛАВАМ" --- */
    #chapter-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: none;
      padding: 18px 14px 48px;
    }

    #chapter-container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px 28px;
      user-select: text;
      -webkit-user-select: text;
    }

    .ch-title {
      color: var(--accent);
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .ch-verse {
      font-size: 19px;
      line-height: 1.65;
      margin-bottom: 12px;
      color: var(--text);
    }

    .ch-vnum {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-right: 6px;
    }

    .ch-dot {
      color: #4C566A;
      margin: 0 5px;
    }

    .ch-nav-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .ch-nav-row button {
      flex: 1;
      height: 40px;
      font-size: 14px;
      font-weight: 500;
    }

    /* --- НИЖНЯЯ СТРОКА СОСТОЯНИЯ --- */
    #status-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 6px 12px max(calc(env(safe-area-inset-bottom, 0px) - 12px), 6px);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      z-index: 30;
    }

    /* --- ЭКРАН ЗАГРУЗКИ --- */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      color: var(--text);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>

  <div id="app">

    <main id="workspace">

      <!-- Масштабируемый и перемещаемый двумя пальцами холст -->
      <div id="canvas-root">
        <div id="card-stack">

      <!-- Автопроигрывание (только в режиме "По словам") -->

      <div id="autoplay-popup">

          <label for="wpm-input">Слов/мин:</label>

    </main>

    <!-- Советский прибор скорости (привязан к интерфейсу снизу, только в режиме "Бегущая строка") -->
    <div id="ticker-dock">

              <line x1="10" y1="46" x2="17" y2="46"/>

              <line x1="85" y1="26" x2="79" y2="29" stroke="#D14953"/>
              <line x1="90" y1="46" x2="83" y2="46" stroke="#D14953"/>
            </g>
            <!-- Подпись на шкале -->
            <text x="50" y="34" text-anchor="middle" fill="#6F6556" font-size="6.5" font-family="monospace">ТХ-800</text>

            </g>

        <div class="gauge-readout">

      <button id="ticker-play-btn" type="button" aria-label="Старт/Пауза бегущей строки">▶</button>
    </div>

    <!-- Режим "По главам" с обычным свайп-скроллом -->
    <section id="chapter-scroll">
      <div id="chapter-container"></div>
    </section>

    <footer id="status-bar">Загрузка...</footer>
  </div>

  <!-- Выдвижная панель настройки скорости в стиле таймера iOS -->
  <div id="ios-speed-backdrop">
    <div id="ios-speed-sheet">
      <div id="ios-ruler-viewport">
